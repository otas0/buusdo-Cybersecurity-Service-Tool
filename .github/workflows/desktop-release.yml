# Publish desktop installers to a GitHub Release and refresh shared/desktop-downloads.json.
# Tag: desktop-v0.2.0  OR  Actions → desktop-release → Run workflow
name: desktop-release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 0.2.0)"
        type: string
        default: "0.2.0"

permissions:
  contents: write

env:
  DESKTOP_VERSION: ${{ github.event.inputs.version || '0.2.0' }}

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#desktop-v}"
          else
            VER="${{ env.DESKTOP_VERSION }}"
            TAG="desktop-v${VER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG (version $VER)"

  linux:
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci || npm install --no-fund --no-audit
      - name: Build amd64 .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev rsync
          cd desktop-app && ARCH=amd64 npm run pack:linux
          test -f dist/linux/preventive-shield_${{ needs.resolve-tag.outputs.version }}_amd64.deb \
            || test -f dist/linux/preventive-shield_0.2.0_amd64.deb
          # Gradual rename: publish buusdo-prefixed copy alongside legacy build output
          VER="${{ needs.resolve-tag.outputs.version }}"
          src=$(ls dist/linux/preventive-shield_*_amd64.deb | head -1)
          cp -f "$src" "dist/linux/buusdo-cybersecurity-service-tool_${VER}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-deb
          path: |
            desktop-app/dist/linux/buusdo-cybersecurity-service-tool_*_amd64.deb
            desktop-app/dist/linux/preventive-shield_*_amd64.deb

  windows:
    needs: resolve-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci || npm install --no-fund --no-audit
      - name: Stage + NSIS
        shell: bash
        run: |
          cd desktop-app
          npm run pack:windows-stage
          choco install nsis -y --no-progress
          export PATH="/c/Program Files (x86)/NSIS:/c/Program Files/NSIS:$PATH"
          mkdir -p dist/windows
          makensis packaging/windows/preventive-shield.nsi
          test -f dist/windows/PreventiveShield-Setup-User.exe
          cp -f dist/windows/PreventiveShield-Setup-User.exe \
            dist/windows/buusdo-cybersecurity-service-tool-Setup-User.exe
      - name: Sign Windows NSIS (Authenticode) when secrets present
        shell: pwsh
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PFX_PASSWORD: ${{ secrets.WIN_CERT_PFX_PASSWORD }}
          WIN_CERT_REQUIRE: ${{ vars.WIN_CERT_REQUIRE || secrets.WIN_CERT_REQUIRE || '0' }}
        run: |
          $exe = Join-Path $PWD "desktop-app/dist/windows/PreventiveShield-Setup-User.exe"
          if ([string]::IsNullOrWhiteSpace($env:WIN_CERT_PFX_BASE64)) {
            if ($env:WIN_CERT_REQUIRE -eq "1") {
              throw "WIN_CERT_REQUIRE=1 but WIN_CERT_PFX_BASE64 is unset — refusing unsigned Windows NSIS"
            }
            Write-Host "WIN_CERT_PFX_BASE64 unset — uploading unsigned installer (set secrets to sign onto the same Release)"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "shield-win.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          $exe2 = Join-Path $PWD "desktop-app/dist/windows/buusdo-cybersecurity-service-tool-Setup-User.exe"
          foreach ($target in @($exe, $exe2)) {
            & signtool sign /f $pfx /p $env:WIN_CERT_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $target" }
            & signtool verify /pa $target
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $target" }
            Write-Host "Signed + verified $target"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-nsis
          path: |
            desktop-app/dist/windows/buusdo-cybersecurity-service-tool-Setup-User.exe
            desktop-app/dist/windows/PreventiveShield-Setup-User.exe

  macos:
    needs: resolve-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci || npm install --no-fund --no-audit
      - name: Build .app zip (unsigned channel note in RELEASE.md)
        run: |
          cd desktop-app
          npm run pack:macos
          mkdir -p dist/macos
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/macos/Preventive Shield.app" \
            "dist/macos/PreventiveShield-macos-app.zip"
          cp -f dist/macos/PreventiveShield-macos-app.zip \
            dist/macos/buusdo-cybersecurity-service-tool-macos-app.zip
          test -f dist/macos/buusdo-cybersecurity-service-tool-macos-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-zip
          path: |
            desktop-app/dist/macos/buusdo-cybersecurity-service-tool-macos-app.zip
            desktop-app/dist/macos/PreventiveShield-macos-app.zip

  publish:
    needs: [resolve-tag, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten assets
        run: |
          mkdir -p out
          find release-assets -type f -print -exec cp {} out/ \;
          ls -la out
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VER: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          # Prefer RELEASE.md as the store-facing body (honest limits + verify steps).
          BODY_FILE=desktop-app/RELEASE.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file "$BODY_FILE"
          else
            gh release create "$TAG" out/* --title "Desktop ${VER}" --notes-file "$BODY_FILE"
          fi
      - name: Echo download URLs (keep shared/desktop-downloads.json in sync on main)
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VER: ${{ needs.resolve-tag.outputs.version }}
        run: |
          BASE="https://github.com/otas0/buusdocst/releases/download/${TAG}"
          echo "Preferred (formal prefix):"
          echo "windowsNsisUrl=${BASE}/buusdo-cybersecurity-service-tool-Setup-User.exe"
          echo "macosAppZipUrl=${BASE}/buusdo-cybersecurity-service-tool-macos-app-notarized.zip  # after notarize + rename"
          echo "macosAppZipUrlUnsigned=${BASE}/buusdo-cybersecurity-service-tool-macos-app.zip"
          echo "linuxDebAmd64Url=${BASE}/buusdo-cybersecurity-service-tool_${VER}_amd64.deb"
          echo "Legacy filenames still uploaded this cycle for continuity."
          echo "Update shared/desktop-downloads.json on main to the buusdo-cybersecurity-service-tool-* URLs when ready."