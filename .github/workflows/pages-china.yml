# Publish china-pages/ to otas0/buusdocst → https://otas0.github.io/buusdocst/
# Source of truth stays in this product repo; Pages URL stays on the short host repo.
name: Pages China

on:
  push:
    branches: [main]
    paths:
      - "china-pages/**"
      - ".github/workflows/pages-china.yml"
  workflow_dispatch:

concurrency:
  group: pages-china
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync instrument tokens into china-pages
        run: |
          cp shared/tokens.css china-pages/assets/tokens.css
          cmp -s shared/tokens.css china-pages/assets/tokens.css

      - name: Assert no Round-2 survey leftovers in publish tree
        run: |
          set -euo pipefail
          if [ -e china-pages/survey-round2.html ]; then
            echo "::error::china-pages/survey-round2.html must not ship (Round-2 survey removed)"
            exit 1
          fi
          if find china-pages -iname '*round2*' -print -quit | grep -q .; then
            echo "::error::china-pages still contains round2 paths"
            find china-pages -iname '*round2*'
            exit 1
          fi
          echo "::notice::china-pages publish tree has no survey-round2.html"

      - name: Publish china-pages to otas0/buusdocst
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.BUUSDOCST_PAGES_DEPLOY_KEY }}
          external_repository: otas0/buusdocst
          publish_dir: ./china-pages
          publish_branch: main
          force_orphan: true
          commit_message: "Publish China entry from buusdo-Cybersecurity-Service-Tool"

      - name: Assert live lang-persist.js + bilingual pages
        run: |
          set -euo pipefail
          base="https://otas0.github.io/buusdocst"
          assert_url() {
            local path="$1"
            local needle="$2"
            local url="${base}${path}"
            for i in 1 2 3 4 5 6 7 8; do
              code=$(curl -sS -L -o /tmp/china-live-body -w "%{http_code}" "$url" || echo "000")
              if [ "$code" = "200" ] && grep -q "$needle" /tmp/china-live-body; then
                echo "OK $url ($code) attempt=$i"
                return 0
              fi
              echo "wait $url code=$code attempt=$i"
              sleep 8
            done
            echo "::error::$url not HTTP 200 with expected body ($needle)"
            return 1
          }
          assert_url "/lang-persist.js" "buusdocst-china-lang"
          for page in "/" "/en.html" "/install.html" "/install-en.html" "/privacy.html" "/privacy-en.html"; do
            assert_url "$page" 'data-china-lang'
          done
          assert_url "/" 'china-workers-locale-hint'

      - name: Soft-check live wordmark Halt-orange / charcoal (needs sharp)
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! node -e "import('sharp').then(()=>process.exit(0)).catch(()=>process.exit(1))"; then
            echo "::warning::sharp not installed — skipping live wordmark pixel soft-check (npm i sharp to enable)"
            exit 0
          fi
          base="https://otas0.github.io/buusdocst"
          curl -sS -L -o /tmp/china-wordmark.png "${base}/assets/buusdo-wordmark.png"
          curl -sS -L -o /tmp/china-wordmark-on-light.png "${base}/assets/buusdo-wordmark-on-light.png"
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          function countOrange(data, info) {
            let orange = 0;
            for (let i = 0; i < data.length; i += info.channels) {
              if (data[i + 3] < 200) continue;
              const r = data[i], g = data[i + 1], b = data[i + 2];
              if (r >= 160 && g <= 120 && b <= 60 && r > g + 40 && r > b + 80) orange += 1;
            }
            return orange;
          }
          const dark = await sharp("/tmp/china-wordmark.png").ensureAlpha().raw().toBuffer({ resolveWithObject: true });
          const orangeDark = countOrange(dark.data, dark.info);
          if (orangeDark > 40) {
            console.error(`SOFT-FAIL live china wordmark has ~${orangeDark} Halt-orange pixels`);
            process.exit(1);
          }
          console.log(`OK live china wordmark Halt-orange px=${orangeDark}`);
          const light = await sharp("/tmp/china-wordmark-on-light.png").ensureAlpha().raw().toBuffer({ resolveWithObject: true });
          let charcoal = 0;
          for (let i = 0; i < light.data.length; i += light.info.channels) {
            if (light.data[i + 3] < 200) continue;
            const r = light.data[i], g = light.data[i + 1], b = light.data[i + 2];
            if (Math.abs(r - 84) <= 14 && Math.abs(g - 84) <= 14 && Math.abs(b - 84) <= 14) charcoal += 1;
          }
          const orangeLight = countOrange(light.data, light.info);
          if (charcoal < 200) {
            console.error(`SOFT-FAIL live china on-light wordmark lacks #545454 u-card (charcoal=${charcoal})`);
            process.exit(1);
          }
          if (orangeLight > 40) {
            console.error(`SOFT-FAIL live china on-light wordmark has Halt-orange u-card (orange=${orangeLight})`);
            process.exit(1);
          }
          console.log(`OK live china on-light wordmark charcoal=${charcoal} orange=${orangeLight}`);
          NODE
