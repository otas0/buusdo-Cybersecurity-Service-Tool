# Publish china-pages/ to otas0/buusdocst → https://otas0.github.io/buusdocst/
# Source of truth stays in this product repo; Pages URL stays on the short host repo.
name: Pages China

on:
  push:
    branches: [main]
    paths:
      - "china-pages/**"
      - ".github/workflows/pages-china.yml"
  workflow_dispatch:

concurrency:
  group: pages-china
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync instrument tokens into china-pages
        run: |
          cp shared/tokens.css china-pages/assets/tokens.css
          cmp -s shared/tokens.css china-pages/assets/tokens.css

      - name: Publish china-pages to otas0/buusdocst
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.BUUSDOCST_PAGES_DEPLOY_KEY }}
          external_repository: otas0/buusdocst
          publish_dir: ./china-pages
          publish_branch: main
          force_orphan: true
          commit_message: "Publish China entry from buusdo-Cybersecurity-Service-Tool"

      - name: Assert live lang-persist.js is 200
        run: |
          set -euo pipefail
          url="https://otas0.github.io/buusdocst/lang-persist.js"
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -L -o /tmp/china-lang-persist.js -w "%{http_code}" "$url" || echo "000")
            if [ "$code" = "200" ] && grep -q "buusdocst-china-lang" /tmp/china-lang-persist.js; then
              echo "OK $url ($code) attempt=$i"
              exit 0
            fi
            echo "wait lang-persist.js code=$code attempt=$i"
            sleep 8
          done
          echo "::error::lang-persist.js not HTTP 200 with expected body at $url"
          exit 1
