# Production health + check:prod on a schedule (ubuntu = CF-reachable).
# Set repository variable PRODUCTION_HEALTH_URL=https://pcpd.mtsu.workers.dev
# (or custom canonical). Optional alerts: secrets SLACK_WEBHOOK_URL; watch repo for email.
#
# On success/failure, appends a row to docs/LAUNCH_CHECKLIST.md § check:prod log and pushes
# (contents: write). Disable push with repository variable CHECKLIST_CI_WRITE=0.
# Bot write setup: docs/CHECKLIST_CI_WRITE.md · ops: docs/OPS_RUNBOOK.md

name: Production health

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Override base URL (https://…); empty = PRODUCTION_HEALTH_URL"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  health:
    name: health + check:prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN; needs Workflow permissions = Read and write (CHECKLIST_CI_WRITE.md).
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Show default branch write expectations
        run: |
          {
            echo "## Checklist bot write"
            echo ""
            echo "- permissions.contents: write (this workflow)"
            echo "- Repo → Settings → Actions → Workflow permissions → Read and write"
            echo "- Kill switch: \`CHECKLIST_CI_WRITE=0\` ([OPS_RUNBOOK.md](docs/OPS_RUNBOOK.md))"
            echo "- Verify: [CHECKLIST_CI_WRITE.md](docs/CHECKLIST_CI_WRITE.md)"
            echo "- CHECKLIST_CI_WRITE var: \`${{ vars.CHECKLIST_CI_WRITE }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No npm ci — lockfile on main can lag; health/check use curl; append script is dep-free.

      - name: Resolve target URL
        id: target
        run: |
          OVERRIDE="${{ github.event.inputs.url }}"
          VAR="${{ vars.PRODUCTION_HEALTH_URL }}"
          DEFAULT="https://pcpd.mtsu.workers.dev"
          if [ -n "$OVERRIDE" ]; then
            URL="$OVERRIDE"
          elif [ -n "$VAR" ]; then
            URL="$VAR"
          else
            URL="$DEFAULT"
            echo "::notice::PRODUCTION_HEALTH_URL unset — using default workers.dev origin"
          fi
          URL=$(echo "$URL" | tr -d '[:space:]' | sed 's:/*$::')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "HEALTH_BASE_URL=$URL" >> "$GITHUB_ENV"

      - name: Health smoke
        id: health
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 30 "$HEALTH_BASE_URL/api/health")
          echo "$body" | tee /tmp/health.json
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"curatedListPresent":true'
          echo "$body" | grep -q '"accountSyncEnabled":false'

      - name: Check smoke
        id: check
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 45 -X POST "$HEALTH_BASE_URL/api/check" \
            -H 'content-type: application/json' -H 'accept: application/json' \
            -d '{"url":"https://example.com"}')
          echo "$body" | tee /tmp/check.json
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"timingValid":true'
          echo "$body" | grep -q '"totalMs"'
          echo "$body" | grep -q '"probeMs"'
          echo "$body" | grep -q '"ambiguousProbeStatus"'

      - name: Append checklist log (OK)
        if: success()
        run: |
          node scripts/append-check-prod-log.mjs \
            --url "${{ steps.target.outputs.url }}" \
            --result OK \
            --runner "github-actions/${{ github.run_id }}" \
            --notes "health+check · ${{ steps.target.outputs.run_url }}"

      - name: Append checklist log (FAIL)
        if: failure()
        run: |
          node scripts/append-check-prod-log.mjs \
            --url "${{ steps.target.outputs.url }}" \
            --result FAIL \
            --runner "github-actions/${{ github.run_id }}" \
            --notes "${{ steps.target.outputs.run_url }}" || true

      - name: Commit checklist log
        id: push
        if: always() && vars.CHECKLIST_CI_WRITE != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAUNCH_CHECKLIST.md
          if git diff --staged --quiet; then
            echo "No checklist changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: log check:prod from CI (${{ job.status }})"
          if git push; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Checklist row committed to default branch"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::error::git push failed — enable Actions read/write or set CHECKLIST_CI_WRITE=0 (docs/CHECKLIST_CI_WRITE.md)"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production health + check:prod"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| base | \`${{ steps.target.outputs.url }}\` |"
            echo "| job | ${{ job.status }} |"
            echo "| run | ${{ steps.target.outputs.run_url }} |"
            echo "| checklist push | ${{ steps.push.outputs.pushed }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::notice::SLACK_WEBHOOK_URL unset — skip Slack (use Slack alert test workflow after setting secret)"
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":x: Preventive Shield health/check failed\\nURL: ${{ steps.target.outputs.url }}\\nRun: ${{ steps.target.outputs.run_url }}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Failure notice (email via GitHub)
        if: failure()
        run: |
          echo "::error::Production health or check:prod failed. Watchers receive GitHub workflow-failure email. Slack: secret SLACK_WEBHOOK_URL + workflow Slack alert test (docs/HEALTH_ALERTS.md)."
