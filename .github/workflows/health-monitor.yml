# Production health + check:prod on a schedule (ubuntu = CF-reachable).
# Set repository variable PRODUCTION_HEALTH_URL=https://buusdocst.mtsu.workers.dev
# (or custom canonical). Optional alerts: secrets SLACK_WEBHOOK_URL; watch repo for email.
#
# On success/failure, appends a row to docs/LAUNCH_CHECKLIST.md § check:prod log and pushes
# (contents: write). Disable push with repository variable CHECKLIST_CI_WRITE=0.
# Bot write setup: docs/CHECKLIST_CI_WRITE.md · ops: docs/OPS_RUNBOOK.md

name: Health monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Override base URL (https://...); empty = PRODUCTION_HEALTH_URL"
        required: false
        default: ""
      force_soft_slack:
        description: "Ops drill: bypass 1h soft-download Slack rate limit (still notice-only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Serialize checklist commits so dual workflow_dispatch does not race on push.
concurrency:
  group: production-health-checklist
  cancel-in-progress: false

jobs:
  health:
    name: health + check:prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Default GITHUB_TOKEN; needs Workflow permissions = Read and write (CHECKLIST_CI_WRITE.md).
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Show default branch write expectations
        run: |
          {
            echo "## Checklist bot write"
            echo ""
            echo "- permissions.contents: write (this workflow)"
            echo "- Repo → Settings → Actions → Workflow permissions → Read and write"
            echo "- Kill switch: \`CHECKLIST_CI_WRITE=0\` ([OPS_RUNBOOK.md](docs/OPS_RUNBOOK.md))"
            echo "- Verify: [CHECKLIST_CI_WRITE.md](docs/CHECKLIST_CI_WRITE.md)"
            echo "- CHECKLIST_CI_WRITE var: \`${{ vars.CHECKLIST_CI_WRITE }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No npm ci — lockfile on main can lag; health/check use curl; append script is dep-free.

      - name: Resolve target URL
        id: target
        run: |
          OVERRIDE="${{ github.event.inputs.url }}"
          VAR="${{ vars.PRODUCTION_HEALTH_URL }}"
          DEFAULT="https://buusdocst.mtsu.workers.dev"
          if [ -n "$OVERRIDE" ]; then
            URL="$OVERRIDE"
          elif [ -n "$VAR" ]; then
            URL="$VAR"
          else
            URL="$DEFAULT"
            echo "::notice::PRODUCTION_HEALTH_URL unset — using default workers.dev origin"
          fi
          URL=$(echo "$URL" | tr -d '[:space:]' | sed 's:/*$::')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "run_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          echo "HEALTH_BASE_URL=$URL" >> "$GITHUB_ENV"

      - name: Health smoke
        id: health
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 30 "$HEALTH_BASE_URL/api/health")
          echo "$body" | tee /tmp/health.json
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"service":"buusdocst"'
          echo "$body" | grep -q '"curatedListPresent":true'
          echo "$body" | grep -q '"accountSyncEnabled":false'
          echo "::notice::health service=buusdocst (legacy preventive-shield / pcpd names must not appear)"

      - name: Check smoke
        id: check
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 45 -X POST "$HEALTH_BASE_URL/api/check" \
            -H 'content-type: application/json' -H 'accept: application/json' \
            -d '{"url":"https://example.com"}')
          echo "$body" | tee /tmp/check.json
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q '"timingValid":true'
          echo "$body" | grep -q '"totalMs"'
          echo "$body" | grep -q '"probeMs"'
          echo "$body" | grep -q '"ambiguousProbeStatus"'

      - name: Account-sync routes Gone (410)
        env:
          PRODUCTION_HEALTH_URL: ${{ env.HEALTH_BASE_URL }}
        run: |
          npm run assert:prod-auth-gone
          echo "::notice::assert:prod-auth-gone OK against $HEALTH_BASE_URL"

      # Soft HEAD check of Settings download URLs (never fails the health job).
      - name: Desktop download HEAD (soft)
        id: downloads
        if: success()
        run: |
          set +e
          node scripts/verify-desktop-download-urls.mjs 2>&1 | tee /tmp/desktop-downloads-head.txt
          code=$?
          set -e
          soft=$(grep -E '^DOWNLOAD_SOFT_WARN_COUNT=' /tmp/desktop-downloads-head.txt | tail -n1 | cut -d= -f2 || true)
          soft=${soft:-0}
          notarized_ok=$(grep -E '^NOTARIZED_HEAD_OK=' /tmp/desktop-downloads-head.txt | tail -n1 | cut -d= -f2 || true)
          notarized_status=$(grep -E '^NOTARIZED_HEAD_STATUS=' /tmp/desktop-downloads-head.txt | tail -n1 | cut -d= -f2 || true)
          notarized_kind=$(grep -E '^NOTARIZED_HEAD_KIND=' /tmp/desktop-downloads-head.txt | tail -n1 | cut -d= -f2 || true)
          echo "soft_warn=$soft" >> "$GITHUB_OUTPUT"
          echo "notarized_ok=${notarized_ok:-skip}" >> "$GITHUB_OUTPUT"
          echo "notarized_status=${notarized_status:-}" >> "$GITHUB_OUTPUT"
          echo "notarized_kind=${notarized_kind:-missing}" >> "$GITHUB_OUTPUT"
          {
            echo "### Desktop download HEAD"
            echo ""
            echo "Exit \`$code\` (soft — VERIFY_DESKTOP_DOWNLOADS_STRICT unset)."
            echo "Soft warn count: \`$soft\`"
            echo "Notarized kind: \`${notarized_kind:-missing}\`"
            if [ "$notarized_ok" = "0" ] || [ "$notarized_kind" = "missing" ]; then
              echo ""
              if [ "$notarized_kind" = "missing" ]; then
                echo "> **Notarized URL missing** — expected for **unsigned** GitHub ship ([DESKTOP_SETUP_GUIDE.md](../docs/DESKTOP_SETUP_GUIDE.md)); annotated only; job stays green."
                echo "::notice::Notarized desktop download URL missing (unsigned ship) — soft; health job continues"
              elif [ "$notarized_kind" = "http-404" ]; then
                echo "> **Notarized HEAD 404** — expected while ship channel is **unsigned** ([DESKTOP_SETUP_GUIDE.md](../docs/DESKTOP_SETUP_GUIDE.md)); annotated only; job stays green."
                echo "::notice::Notarized desktop download HEAD 404 (unsigned ship) — soft; see DESKTOP_SETUP_GUIDE"
              else
                echo "> **Notarized HEAD ≠ 200** (kind \`${notarized_kind}\`, status \`${notarized_status:-?}\`) — unsigned ship; see [DESKTOP_SETUP_GUIDE.md](../docs/DESKTOP_SETUP_GUIDE.md)."
                echo "::notice::Notarized desktop download HEAD ≠ 200 (kind ${notarized_kind}, status ${notarized_status:-?}) — soft; health job continues"
              fi
            fi
            if [ "${soft:-0}" -gt 0 ] 2>/dev/null; then
              echo "::notice::Desktop download HEAD soft warnings: $soft (notice-only; no page)"
            fi
            echo ""
            echo '```'
            tail -n 40 /tmp/desktop-downloads-head.txt || true
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # Soft: always continue even if HEAD fails (first publish / CDN lag).
          exit 0

      - name: Restore soft-download Slack rate state
        id: soft_slack_cache
        if: success() && steps.downloads.outputs.soft_warn != '' && steps.downloads.outputs.soft_warn != '0'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/shield-soft-download-slack.json
          key: soft-download-slack-state-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            soft-download-slack-state-v1-${{ runner.os }}-

      - name: Slack notice — soft download HEAD warnings
        id: soft_slack_send
        if: >-
          success() &&
          steps.downloads.outputs.soft_warn != '' &&
          (steps.downloads.outputs.soft_warn != '0' || github.event.inputs.force_soft_slack == 'true')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FORCE_SOFT_SLACK: ${{ github.event.inputs.force_soft_slack }}
        run: |
          SOFT="${{ steps.downloads.outputs.soft_warn }}"
          NOW=$(date +%s)
          SEND=1
          RATE_LIMITED=false
          FORCE="${FORCE_SOFT_SLACK:-false}"
          # Rate limit before webhook so Actions summary can show rateLimited=true
          # even when SLACK_WEBHOOK_URL is unset (ops still see the 1h gate).
          if [ "$FORCE" != "true" ] && [ -f /tmp/shield-soft-download-slack.json ]; then
            PREV_SOFT=$(python3 -c "import json;print(json.load(open('/tmp/shield-soft-download-slack.json')).get('softWarn',''))" 2>/dev/null || true)
            PREV_AT=$(python3 -c "import json;print(int(json.load(open('/tmp/shield-soft-download-slack.json')).get('sentAt',0)))" 2>/dev/null || echo 0)
            AGE=$((NOW - PREV_AT))
            if [ "$PREV_SOFT" = "$SOFT" ] && [ "$AGE" -lt 3600 ]; then
              SEND=0
              RATE_LIMITED=true
              echo "::notice::Soft download Slack rate-limited (same soft_warn=${SOFT} within 1h; age ${AGE}s)"
              {
                echo "### Soft download Slack"
                echo ""
                echo "\`rateLimited=true\` — same soft_warn=\`${SOFT}\` within 1h (age ${AGE}s); notice skipped."
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$FORCE" = "true" ]; then
            echo "::notice::force_soft_slack=true — bypassing 1h rate limit (ops drill)"
          fi
          echo "rate_limited=$RATE_LIMITED" >> "$GITHUB_OUTPUT"
          if [ "$SEND" != "1" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::notice::SLACK_WEBHOOK_URL unset — skip soft-download Slack notice"
            # Still stamp rate state so a follow-up run within 1h reports rateLimited=true.
            printf '{"softWarn":"%s","sentAt":%s}\n' "$SOFT" "$NOW" > /tmp/shield-soft-download-slack.json
            echo "updated=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Soft download Slack"
              echo ""
              echo "\`rateLimited=false|skipped-no-webhook\` — soft_warn=\`${SOFT}\`; secret unset."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          KIND="${{ steps.downloads.outputs.notarized_kind }}"
          RELEASE_HINT=""
          if [ "$KIND" = "missing" ]; then
            NOTARY_LINE="Notarized: URL missing (unsigned GitHub ship — expected)"
          elif [ "$KIND" = "http-404" ]; then
            NOTARY_LINE="Notarized: HEAD 404 (unsigned ship — expected)"
            RELEASE_HINT=" See docs/DESKTOP_SETUP_GUIDE.md (Gatekeeper / SmartScreen)."
          elif [ "$KIND" = "ok" ]; then
            NOTARY_LINE="Notarized: HEAD 200"
          else
            NOTARY_LINE="Notarized: kind=$KIND status=${{ steps.downloads.outputs.notarized_status }}"
            RELEASE_HINT=" See docs/DESKTOP_SETUP_GUIDE.md (unsigned GitHub ship)."
          fi
          # Notice-only (not a failure / not a page). Soft HEAD lag is expected for unsigned ship.
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":information_source: buusdo download HEAD soft warnings (${SOFT})\\nservice=buusdocst\\n${NOTARY_LINE}\\nRun: ${{ steps.target.outputs.run_url }}\\n(notice-only - health job stayed green)${RELEASE_HINT}\"}" \
            "$SLACK_WEBHOOK_URL"
          printf '{"softWarn":"%s","sentAt":%s}\n' "$SOFT" "$NOW" > /tmp/shield-soft-download-slack.json
          echo "updated=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Soft download Slack"
            echo ""
            echo "\`rateLimited=false\` — notice posted (soft_warn=\`${SOFT}\`; force=${FORCE})."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save soft-download Slack rate state
        if: success() && steps.soft_slack_send.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/shield-soft-download-slack.json
          key: soft-download-slack-state-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Append checklist log (OK)
        if: success()
        run: |
          node scripts/append-check-prod-log.mjs \
            --url "${{ steps.target.outputs.url }}" \
            --result OK \
            --runner "github-actions/${{ github.run_id }}" \
            --notes "health+check · softDownloadWarn=${{ steps.downloads.outputs.soft_warn }} · notarized=${{ steps.downloads.outputs.notarized_kind }} · ${{ steps.target.outputs.run_url }}"

      - name: Append checklist log (FAIL)
        if: failure()
        run: |
          node scripts/append-check-prod-log.mjs \
            --url "${{ steps.target.outputs.url }}" \
            --result FAIL \
            --runner "github-actions/${{ github.run_id }}" \
            --notes "${{ steps.target.outputs.run_url }}" || true

      - name: Commit checklist log
        id: push
        # Unset CHECKLIST_CI_WRITE must still run; only explicit "0" disables.
        if: ${{ always() && vars.CHECKLIST_CI_WRITE != '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LAUNCH_CHECKLIST.md
          if git diff --staged --quiet; then
            echo "No checklist changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: log check:prod from CI (${{ job.status }})"
          # Retry rebase+push — concurrency group serializes jobs; this covers residual races
          # and Contents-API tip advances that leave the runner tip non-fast-forward.
          ok=0
          attempts=0
          BRANCH="${{ github.ref_name }}"
          for i in 1 2 3 4 5; do
            attempts=$i
            if git push origin "HEAD:refs/heads/${BRANCH}"; then
              ok=1
              break
            fi
            echo "::notice::checklist push attempt $i failed — fetch + rebase onto origin/${BRANCH}"
            git fetch origin "${BRANCH}" || true
            if ! git rebase "origin/${BRANCH}"; then
              echo "::warning::rebase conflict — prefer ours for docs/LAUNCH_CHECKLIST.md then continue"
              git checkout --ours -- docs/LAUNCH_CHECKLIST.md 2>/dev/null || true
              # Re-apply this run's staged row if rebase dropped it.
              git add docs/LAUNCH_CHECKLIST.md 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue 2>/dev/null || git rebase --abort || true
              # Fallback: rebuild tip from remote + our commit message file
              git fetch origin "${BRANCH}" || true
              git reset --soft "origin/${BRANCH}" || true
              git add docs/LAUNCH_CHECKLIST.md
              git diff --staged --quiet || git commit -m "chore: log check:prod from CI (${{ job.status }})"
            fi
            sleep $((i * 2))
          done
          echo "push_attempts=$attempts" >> "$GITHUB_OUTPUT"
          if [ "$ok" = "1" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Checklist row committed to default branch (attempts=${attempts})"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::error::git push failed after ${attempts} attempts — enable Actions read/write or set CHECKLIST_CI_WRITE=0 (docs/CHECKLIST_CI_WRITE.md)"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Production health + check:prod"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| base | \`${{ steps.target.outputs.url }}\` |"
            echo "| job | ${{ job.status }} |"
            echo "| run | ${{ steps.target.outputs.run_url }} |"
            echo "| checklist push | ${{ steps.push.outputs.pushed }} |"
            echo "| checklist push attempts | ${{ steps.push.outputs.push_attempts }} |"
            echo "| download HEAD | soft warn \`${{ steps.downloads.outputs.soft_warn }}\` · notarized \`${{ steps.downloads.outputs.notarized_ok }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::notice::SLACK_WEBHOOK_URL unset — skip Slack (use Slack alert test workflow after setting secret)"
            exit 0
          fi
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":x: buusdo health/check failed\\nservice=buusdocst\\nURL: ${{ steps.target.outputs.url }}\\nRun: ${{ steps.target.outputs.run_url }}\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Failure notice (email via GitHub)
        if: failure()
        run: |
          echo "::error::Production health or check:prod failed. Watchers receive GitHub workflow-failure email. Slack: secret SLACK_WEBHOOK_URL + workflow Slack alert test (docs/HEALTH_ALERTS.md)."

  # Optional staging origin — when set, require accountSyncEnabled false (product cancelled).
  # When STAGING_HEALTH_URL unset → gate pending (optional, not a failure).
  staging-health:
    name: staging health (optional)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Staging health (require sync off when URL set)
        env:
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/assert-staging-health.mjs