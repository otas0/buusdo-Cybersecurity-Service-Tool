# Account sync product cancelled — workflow retained so old bookmarks/cron stay green.
# No magic-link / exchange / lists STRICT smokes.
name: Staging STRICT smokes

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:

jobs:
  strict-smokes:
    name: Account sync cancelled (no STRICT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notice — product cancelled
        run: |
          {
            echo "### Staging STRICT smokes"
            echo ""
            echo "**cancelled** — Account sync is not shipping."
            echo "Gate doc: [ACCOUNT_SYNC_GATE.md](https://github.com/${{ github.repository }}/blob/main/docs/ACCOUNT_SYNC_GATE.md)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Account sync product cancelled — STRICT smokes not run"
