name: CI
# run-name is event/PR label only — mid-job rename is impossible.
# See desktop-app/RELEASE.md#ci-strict-run-name (STRICT_MAC_SOURCE_TITLE via follow-up step name).
run-name: "CI — ${{ github.event_name }}${{ github.event.pull_request.number && format(' PR #{0}', github.event.pull_request.number) || '' }}"

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly 05:15 UTC — desktop MVP + check:desktop (does not slow PR quality)
    - cron: "15 5 * * *"
  workflow_dispatch:
    inputs:
      run_desktop_check:
        description: "Run check:desktop (proxy readout + install-accept)"
        type: boolean
        default: true
      run_mvp:
        description: "Run npm run mvp (full desktop MVP gate)"
        type: boolean
        default: true

# evaluation-diff is a separate required-capable check on PRs (exit 1 on newly failed scenarios).
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          # Node 22 CI vs local Node 24 can leave optional native deps out of sync; prefer ci, fall back once.
          npm ci || npm install --no-fund --no-audit

      - name: Unit tests
        run: |
          npm run test
          echo "::notice::shield-lists classic fixture covered in tests/shield-lists.test.ts (mjs + shield-lists.classic.js parity)"

      - name: Pack coverage ratios (locale notice)
        run: |
          summary="$(node scripts/print-pack-coverage-summary.mjs)"
          echo "$summary"
          echo "::notice::$summary"

      - name: QR browser bundle soft-check
        run: |
          if [ ! -f shared/qrcode-browser.js ]; then
            echo "::warning::shared/qrcode-browser.js missing — run npm run qr:bundle (needs browserify + qrcode)"
            exit 0
          fi
          if ! grep -q 'toCanvas' shared/qrcode-browser.js; then
            echo "::warning::shared/qrcode-browser.js present but toCanvas export not found — regenerate with npm run qr:bundle"
            exit 0
          fi
          echo "::notice::shared/qrcode-browser.js OK (toCanvas present; regenerate via npm run qr:bundle)"

      - name: Playwright LEAVE_AND_BLOCK fixture host soft-check
        env:
          STRICT_LEAVE_AND_BLOCK: "1"
        run: |
          host=$(node -e "const f=require('./playwright/fixtures/leave-and-block.json'); console.log(f.host||'')")
          if [ -z "$host" ]; then
            echo "::error::playwright/fixtures/leave-and-block.json missing host"
            exit 1
          fi
          if ! node -e "const c=require('./security/data/curated-threats.json'); if(!c.hosts['$host']) process.exit(2)"; then
            echo "::error::Playwright fixture host '$host' missing from security/data/curated-threats.json (STRICT_LEAVE_AND_BLOCK=1)"
            exit 1
          fi
          echo "::notice::Playwright LEAVE_AND_BLOCK fixture host present in curated-threats.json ($host)"

      - name: Formal product name (README + brand.json)
        run: npm run assert:formal-name

      - name: Store Halt/Clear/Hold FRAME (Sharp structural floors)
        run: |
          npm run capture:store-halt-frame
          # Byte-identical git diff is not portable (Sharp/libvips differs mac vs linux).
          # Committed PNGs stay the human-reviewed refs; CI asserts structural floors.
          node scripts/assert-store-halt-frame-floors.mjs
          git checkout -- \
            docs/store-screenshots/FRAME-formal-name.png \
            docs/store-screenshots/FRAME-clear.png \
            docs/store-screenshots/FRAME-hold.png
          echo "::notice::FRAME Halt/Clear/Hold structural floors OK (working tree restored)"

      - name: Pack Chrome store listing FRAMEs zip
        run: npm run pack:chrome-store

      - name: Upload listing-frames.zip
        uses: actions/upload-artifact@v4
        with:
          name: listing-frames
          path: dist/chrome-webstore/*-listing-frames.zip
          if-no-files-found: error

      - name: Cache Playwright browsers (quality Chromium)
        id: pw_quality_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Store Halt FRAME Playwright cross-check (Chromium)
        run: |
          HIT="${{ steps.pw_quality_cache.outputs.cache-hit }}"
          echo "Playwright browser cache-hit=${HIT:-false}"
          # Cache covers chromium + headless-shell under ~/.cache/ms-playwright (avoid laptop CDN).
          if [ "${HIT:-false}" = "true" ] && ls "$HOME/.cache/ms-playwright"/chromium_headless_shell-*/chrome-headless-shell-*/chrome-headless-shell >/dev/null 2>&1; then
            echo "Reusing cached Chromium + headless-shell"
            echo "::notice::Playwright headless-shell restored from cache (warm; skip CDN install)"
          else
            npx playwright install --with-deps chromium
          fi
          npm run capture:store-halt-frame:playwright
          npm run capture:desktop-about-frame
          npm run test:playwright:china-soft-fail
          # Keep committed About FRAME if capture wrote a new one (review in PR).
          test -f docs/store-screenshots/FRAME-desktop-about.png

      - name: Typecheck
        run: npm run typecheck

      - name: Promo posters cachebust (build + diff public/promo)
        run: |
          # Allow regen in CI, then require the working tree to match what we commit.
          PROMO_CACHEBUST_REBUILD=1 npm run assert:promo-cachebust
          # Fail if committed public/promo drifted from rebuild (except .cachebust already asserted).
          if ! git diff --exit-code -- public/promo/poster.html public/promo/.cachebust public/promo/china-qr.svg public/promo/product-qr.svg; then
            echo "::error::public/promo drifted — run npm run build:promo-posters and commit"
            git diff --stat -- public/promo || true
            exit 1
          fi

      - name: Promo privacy routes against local :3000
        id: promo_routes
        run: |
          set -euo pipefail
          npm run dev -- --port 3000 > /tmp/vinext-promo-routes.log 2>&1 &
          echo $! > /tmp/vinext-promo-routes.pid
          ready=0
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 "http://127.0.0.1:3000/api/health" >/dev/null 2>&1 \
              || curl -sf --max-time 2 "http://127.0.0.1:3000/" >/dev/null 2>&1; then
              ready=1
              echo "::notice::vinext ready on :3000 after ${i}s for promo privacy routes"
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::warning::vinext not ready — soft-skip assert:promo-privacy-routes (see /tmp/vinext-promo-routes.log)"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            kill "$(cat /tmp/vinext-promo-routes.pid)" 2>/dev/null || true
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          # Hard-fail when vinext is up but any promo/privacy route is non-2xx.
          PROMO_ORIGIN=http://127.0.0.1:3000 npm run assert:promo-privacy-routes
          kill "$(cat /tmp/vinext-promo-routes.pid)" 2>/dev/null || true

      - name: Promo PDF artifact (print handoff)
        continue-on-error: true
        run: |
          set -euo pipefail
          HIT="${{ steps.pw_quality_cache.outputs.cache-hit }}"
          if [ "${HIT:-false}" = "true" ] && ls "$HOME/.cache/ms-playwright"/chromium_headless_shell-*/chrome-headless-shell-*/chrome-headless-shell >/dev/null 2>&1; then
            echo "Reusing cached Chromium for promo PDF"
          else
            npx playwright install --with-deps chromium
          fi
          npm run export:promo-poster-pdf
          test -f docs/promo/poster.pdf
          test -f public/promo/poster.pdf
          node scripts/assert-promo-poster-pdf-floor.mjs

      - name: Upload promo poster.pdf
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: promo-poster-pdf
          path: |
            docs/promo/poster.pdf
            public/promo/poster.pdf
          if-no-files-found: warn

      - name: Lint
        run: npm run lint

      - name: Threat check (curated list + regression)
        id: threat_check
        run: |
          npm run threat:check:help
          if ! npm run threat:check; then
            echo "::notice::threat:check failed — exit 1 = invalid curated list or regression; exit 2 = cannot read curated file. Run: npm run threat:check:help"
            exit 1
          fi

      - name: Controlled evaluation
        run: npm run evaluate

      - name: Confirm evaluate scenario count (EVAL suite)
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const r = JSON.parse(readFileSync("evaluation/results/evaluation-results.json", "utf8"));
            const n = r.summary?.totalScenarios ?? r.scenarios?.length ?? 0;
            // Bump min again when the suite exceeds 64 (EVAL-057–064 = PT insurance/IRS batch).
            const min = 64;
            if (n < min) {
              console.error(`::error::evaluate totalScenarios=${n} < ${min} (expected full suite incl. EVAL-057–064)`);
              process.exit(1);
            }
            console.log(`::notice::evaluate totalScenarios=${n} (min ${min})`);
          '

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results/evaluation-results.json
          if-no-files-found: warn

      - name: Evaluation diff script smoke (push)
        if: github.event_name != 'pull_request' && success()
        run: npm run evaluate:diff -- evaluation/results/evaluation-results.json evaluation/results/evaluation-results.json

      - name: evaluate:diff:smoke expects exit 1
        run: |
          set +e
          npm run evaluate:diff:smoke
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::evaluate:diff:smoke expected exit 1 (newly failed fixture), got $code"
            exit 1
          fi
          echo "evaluate:diff:smoke OK (exit 1 as expected)"
          if [ ! -f evaluation/diff.md ]; then
            echo "::warning::evaluation/diff.md missing after smoke exit 1 — continuing (soft fail)"
          fi

      - name: OpenAPI / schema copy sync
        run: npm run openapi:check

      - name: API_CHECK_CONTRACT extension copy sync
        run: |
          if ! cmp -s docs/API_CHECK_CONTRACT.md extension/shared/API_CHECK_CONTRACT.md; then
            echo "::error::extension/shared/API_CHECK_CONTRACT.md drifted from docs/ — copy docs/API_CHECK_CONTRACT.md to extension/shared/"
            exit 1
          fi

      - name: Extension fallback notice key only via shared module
        run: |
          # Fail if popup redefines the storage key string instead of importing the shared export.
          if grep -nE 'websiteApiBaseFallbackNotice' extension/popup/popup.js; then
            echo "::error::extension/popup/popup.js must not hardcode API_BASE_FALLBACK_NOTICE_KEY — import from shared/api-base-fallback.mjs"
            exit 1
          fi
          grep -q 'API_BASE_FALLBACK_NOTICE_KEY' extension/popup/popup.js
          grep -q 'from "../shared/api-base-fallback.mjs"' extension/popup/popup.js

      - name: Build
        run: npm run build

  desktop-linux:
    name: desktop-linux (sample + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci || npm install --no-fund --no-audit
      - name: Linux autostart / crontab sample
        run: npm run sample:desktop-linux-autostart
      - name: Assert debian control trailing newline
        run: npm run assert:debian-control-newline
      - name: Assemble amd64 deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev rsync
          cd desktop-app && ARCH=amd64 npm run pack:linux
          test -f dist/linux/preventive-shield_0.2.0_amd64.deb
          node ../scripts/assert-desktop-pack-express.mjs \
            dist/linux/preventive-shield_0.2.0_amd64/usr/lib/preventive-shield
      - name: Tray icons in amd64 pack tree
        run: |
          node scripts/assert-pack-tray-files.mjs desktop-app/dist/linux/preventive-shield_0.2.0_amd64/usr/lib/preventive-shield/assets
          npm run smoke:desktop-pack-tray-assets
      - name: Smoke-install amd64 .deb
        run: |
          sudo apt-get install -y -qq nodejs xdg-utils || true
          sudo dpkg -i desktop-app/dist/linux/preventive-shield_0.2.0_amd64.deb || sudo apt-get install -f -y
          test -x /usr/bin/preventive-shield
          test -f /usr/lib/preventive-shield/src/launcher.js
          # Staged deb tree (argv) + installed pack root — same icon list, both must pass.
          SHIELD_PACK_TRAY_ROOT=/usr/lib/preventive-shield \
            node scripts/assert-pack-tray-files.mjs \
            desktop-app/dist/linux/preventive-shield_0.2.0_amd64/usr/lib/preventive-shield/assets
          SHIELD_PACK_TRAY_ROOT=/usr/lib/preventive-shield npm run smoke:desktop-pack-tray-assets
          # Deb install must not write ~/.config (often not writable as expected on runners).
          DEB_DATA=$(mktemp -d)
          SHIELD_DATA_DIR="$DEB_DATA" SHIELD_LAUNCHER_NO_BROWSER=1 SHIELD_MACHINE_SCAN=0 \
            /usr/bin/preventive-shield --install
          rm -rf "$DEB_DATA"
          dpkg-query -W -f='${Package} ${Version} ${Status}\n' preventive-shield
          sudo dpkg -r preventive-shield
          test ! -e /usr/bin/preventive-shield
      - name: Assemble arm64 staged tree
        run: |
          cd desktop-app && ARCH=arm64 npm run pack:linux
          test -d dist/linux/preventive-shield_0.2.0_arm64
          grep -q 'Architecture: arm64' dist/linux/preventive-shield_0.2.0_arm64/DEBIAN/control
          # Staged tree exists (test -d above) — assets/ with tray icons is required.
          ARM64_ASSETS=dist/linux/preventive-shield_0.2.0_arm64/usr/lib/preventive-shield/assets
          if [ ! -d "$ARM64_ASSETS" ]; then
            echo "::error::arm64 staged tree present but assets/ missing — tray icons required"
            exit 1
          fi
          node ../scripts/assert-pack-tray-files.mjs "$ARM64_ASSETS"
          EXPECTED_TRAY=$(node -e "process.stdout.write(String(require('../shared/desktop-tray-icons.json').length))")
          TRAY_COUNT=$(ls -1 "$ARM64_ASSETS"/tray-icon* 2>/dev/null | wc -l | tr -d ' ')
          echo "arm64 tray-icon listing (count=$TRAY_COUNT expected=$EXPECTED_TRAY):"
          ls -la "$ARM64_ASSETS"/tray-icon*
          if [ "$TRAY_COUNT" != "$EXPECTED_TRAY" ]; then
            echo "::error::arm64 tray-icon* count ($TRAY_COUNT) != shared/desktop-tray-icons.json length ($EXPECTED_TRAY)"
            exit 1
          fi
          # Basename set must match shared/desktop-tray-icons.json entries (not only count).
          EXPECTED_NAMES=$(node -e "JSON.parse(require('fs').readFileSync('../shared/desktop-tray-icons.json','utf8')).slice().sort().forEach(n=>console.log(n))")
          ACTUAL_NAMES=$(ls -1 "$ARM64_ASSETS"/tray-icon* 2>/dev/null | xargs -n1 basename | sort)
          if [ "$ACTUAL_NAMES" != "$EXPECTED_NAMES" ]; then
            echo "::error::arm64 tray-icon* basenames != shared/desktop-tray-icons.json"
            echo "expected:"
            echo "$EXPECTED_NAMES"
            echo "actual:"
            echo "$ACTUAL_NAMES"
            exit 1
          fi
          echo "arm64 tray-icon basename set ok"
          # Shared typo scan (icon-tray*, Tray-Icon.png case variants, …) — same as tests/arm64-tray-icon-typo.test.ts
          node ../scripts/assert-tray-icon-typos.mjs "$ARM64_ASSETS"
          echo "arm64 tray-icon typo scan ok (incl. icon-tray*)"
          # Same express gate as amd64 / mac zip / Windows stage (npm ci --omit=dev inside pack).
          node ../scripts/assert-desktop-pack-express.mjs \
            dist/linux/preventive-shield_0.2.0_arm64/usr/lib/preventive-shield
          # Cross-arch .deb may be absent without a foreign dpkg; staged tree is the artifact.
          if [ -f dist/linux/preventive-shield_0.2.0_arm64.deb ]; then
            echo "arm64 deb built on this runner"
          else
            echo "arm64 staged tree only (no cross dpkg-deb) — uploading directory"
            tar -C dist/linux -czf dist/linux/preventive-shield_0.2.0_arm64-staged.tar.gz preventive-shield_0.2.0_arm64
          fi

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-debs
          path: |
            desktop-app/dist/linux/*.deb
            desktop-app/dist/linux/*-staged.tar.gz
          if-no-files-found: warn

  desktop-windows:
    name: desktop-windows (Startup sample + stage)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci || npm install --no-fund --no-audit
      - name: Windows Startup / Run / schtasks sample
        run: npm run sample:desktop-windows-startup
      - name: Stage NSIS tree with node.exe
        shell: bash
        run: |
          cd desktop-app
          npm run pack:windows-stage
          test -d packaging/windows/stage/app
          test -f packaging/windows/stage/app/src/launcher.js
          test -f packaging/windows/stage/node.exe
          node ../scripts/assert-desktop-pack-express.mjs packaging/windows/stage/app
          ls packaging/windows/stage | head
      - name: Tray icons in Windows stage tree
        shell: bash
        run: |
          test -f desktop-app/packaging/windows/stage/app/assets/tray-icon.ico
          test -f desktop-app/packaging/windows/stage/app/assets/tray-icon.png
          npm run smoke:desktop-pack-tray-assets
      - name: Build NSIS installer (makensis)
        shell: bash
        run: |
          choco install nsis -y --no-progress
          export PATH="/c/Program Files (x86)/NSIS:/c/Program Files/NSIS:$PATH"
          cd desktop-app
          mkdir -p dist/windows
          makensis packaging/windows/preventive-shield.nsi
          test -f dist/windows/PreventiveShield-Setup-User.exe
      - name: Silent-install NSIS and confirm node.exe beside app
        shell: pwsh
        run: |
          $root = Join-Path $PWD "desktop-app"
          $verify = Join-Path $root "dist/windows/verify-install"
          $setup = Join-Path $root "dist/windows/PreventiveShield-Setup-User.exe"
          if (Test-Path $verify) { Remove-Item -Recurse -Force $verify }
          New-Item -ItemType Directory -Path $verify | Out-Null
          # /S silent; /D= last (NSIS install directory)
          $p = Start-Process -FilePath $setup -ArgumentList @("/S", "/D=$verify") -PassThru -Wait
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne $null) {
            Write-Host "installer exit $($p.ExitCode) — checking tree anyway"
          }
          $node = Join-Path $verify "node.exe"
          $launcher = Join-Path $verify "app/src/launcher.js"
          if (-not (Test-Path $node)) { throw "missing $node after silent NSIS install" }
          if (-not (Test-Path $launcher)) { throw "missing $launcher after silent NSIS install" }
          Get-ChildItem $verify | Select-Object -First 12 | Format-Table Name, Length
          Write-Host "node.exe + app tree present under install dir"
      - name: signtool verify when Authenticode secrets present
        shell: pwsh
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PFX_PASSWORD: ${{ secrets.WIN_CERT_PFX_PASSWORD }}
          WIN_CERT_REQUIRE: ${{ vars.WIN_CERT_REQUIRE || '0' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CERT_PFX_BASE64)) {
            if ($env:WIN_CERT_REQUIRE -eq "1") {
              throw "WIN_CERT_REQUIRE=1 but WIN_CERT_PFX_BASE64 unset — signtool verify cannot be skipped"
            }
            Write-Host "No WIN_CERT_PFX_BASE64 — skip signtool verify"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "shield-win-ci.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT_PFX_BASE64))
          $exe = Join-Path $PWD "desktop-app/dist/windows/PreventiveShield-Setup-User.exe"
          & signtool sign /f $pfx /p $env:WIN_CERT_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
          & signtool verify /pa $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }
          Write-Host "signtool verify ok"
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-nsis
          path: desktop-app/dist/windows/PreventiveShield-Setup-User.exe
          if-no-files-found: warn

  desktop-macos:
    name: desktop-macos (install-accept / LaunchAgent)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: |
          npm ci || npm install --no-fund --no-audit
          # Desktop express (+ optional systray2) is not hoisted from the root package.json.
          cd desktop-app && (npm ci || npm install --no-fund --no-audit)
      - name: Assert no product LaunchAgent on runner account
        run: |
          AGENT="$HOME/Library/LaunchAgents/pt.preventiveshield.desktop.plist"
          if [ -f "$AGENT" ]; then
            echo "::error::Unexpected LaunchAgent on CI account: $AGENT"
            exit 1
          fi
          echo "LaunchAgent absent — ok"
      - name: Install-accept smoke
        run: npm run smoke:desktop-install-accept

  graphics-charcoal-optional:
    name: graphics wordmark charcoal (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci || npm install --no-fund --no-audit
      - name: Assert Graphics Enhancement Tool wordmark charcoal
        id: charcoal
        continue-on-error: true
        env:
          # Absolute path on the runner, or leave empty and use GRAPHICS_WORDMARK_B64.
          GRAPHICS_WORDMARK_PATH: ${{ secrets.GRAPHICS_WORDMARK_PATH }}
          # Optional base64 PNG when no path is mounted (repo secret).
          GRAPHICS_WORDMARK_B64: ${{ secrets.GRAPHICS_WORDMARK_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${GRAPHICS_WORDMARK_B64:-}" ]; then
            echo "$GRAPHICS_WORDMARK_B64" | base64 -d > /tmp/graphics-logo-wordmark.png
            export GRAPHICS_WORDMARK=/tmp/graphics-logo-wordmark.png
            echo "::notice::Using GRAPHICS_WORDMARK_B64 secret → $GRAPHICS_WORDMARK"
          fi
          # Sibling clone is optional on CI runners; soft-skip when absent.
          CANDIDATES=(
            "${GRAPHICS_WORDMARK:-}"
            "${GRAPHICS_WORDMARK_PATH:-}"
            "$HOME/buusdo/docs/promo/logo-wordmark.png"
            "../buusdo/docs/promo/logo-wordmark.png"
          )
          FOUND=""
          for p in "${CANDIDATES[@]}"; do
            [ -n "$p" ] && [ -f "$p" ] && FOUND="$p" && break
          done
          if [ -z "$FOUND" ]; then
            echo "::notice::Graphics wordmark absent — skip charcoal assert (optional job). Set secrets.GRAPHICS_WORDMARK_PATH or GRAPHICS_WORDMARK_B64."
            exit 0
          fi
          GRAPHICS_WORDMARK="$FOUND" npm run assert:graphics-wordmark-charcoal

  graphics-charcoal-scheduled:
    name: graphics wordmark charcoal (scheduled clone)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_desktop_check == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci || npm install --no-fund --no-audit
      - name: Clone Graphics Enhancement Tool (required sibling)
        run: |
          set -euo pipefail
          # Public clone of the Graphics line product for charcoal #545454 spot-check.
          git clone --depth 1 https://github.com/otas0/buusdo-Graphics-Enhancement-Tool.git "$HOME/buusdo"
          test -f "$HOME/buusdo/docs/promo/logo-wordmark.png"
      - name: Assert Graphics wordmark charcoal (required)
        run: |
          set -euo pipefail
          export GRAPHICS_WORDMARK="${HOME}/buusdo/docs/promo/logo-wordmark.png"
          export GRAPHICS_WORDMARK_REQUIRED=1
          npm run assert:graphics-wordmark-charcoal

  check-desktop-optional:
    name: check:desktop (dispatch / nightly)
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_desktop_check == true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: |
          npm ci || npm install --no-fund --no-audit
          cd desktop-app && (npm ci || npm install --no-fund --no-audit)
      - name: check:desktop
        env:
          SHIELD_QUIT_GRACE_MS: "0"
        # tsx line + GITHUB_STEP_SUMMARY written once by package.json check:desktop (no double-print).
        run: npm run check:desktop
      - name: Upload currentDir timeline if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-currentDir-timeline
          path: desktop-app/dist/smoke-currentDir-timeline.json
          if-no-files-found: ignore

  mvp-optional:
    name: mvp (dispatch / nightly)
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_mvp == true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci || npm install --no-fund --no-audit
      - name: Install Playwright Chromium (DOM Standby in proxy smoke)
        run: npx playwright install --with-deps chromium
      - name: Store Halt FRAME Playwright cross-check
        run: npm run capture:store-halt-frame:playwright
      - name: quarantine focus-visible Tab smoke
        run: npm run test:playwright:quarantine-focus
      - name: npm run mvp
        env:
          SHIELD_QUIT_GRACE_MS: "0"
        run: npm run mvp
      - name: home-continue timeline (read-only)
        env:
          SHIELD_QUIT_GRACE_MS: "0"
        run: npm run smoke:desktop-home-continue
      - name: verify desktop download URLs (soft, or STRICT if Release exists)
        # After first desktop-v0.2.0 publish this step must fail the mvp job on any URL miss.
        continue-on-error: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: desktop-v0.2.0
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG present — VERIFY_DESKTOP_DOWNLOADS_STRICT=1 (mvp fails on 404)"
            VERIFY_DESKTOP_DOWNLOADS_STRICT=1 npm run verify:desktop-downloads
          else
            echo "Release $RELEASE_TAG absent — soft verify (404 OK until first publish)"
            npm run verify:desktop-downloads
          fi
      - name: tray icons in packaging trees
        run: npm run smoke:desktop-pack-tray-assets
      - name: Export home-continue timeline PNG (ops chart)
        if: always()
        env:
          SHIELD_RELEASE_TAG: desktop-v0.2.0
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f desktop-app/dist/smoke-currentDir-timeline.json ]; then
            echo "No timeline JSON — skip PNG"
            exit 0
          fi
          # Chromium already installed for mvp proxy DOM — reuse cache; install only if missing.
          if [ -d "${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}" ]; then
            echo "Reusing Playwright Chromium from mvp install"
          else
            echo "Playwright browsers missing — installing chromium once"
            npx playwright install --with-deps chromium
          fi
          node scripts/export-home-continue-png.mjs
      - name: Upload mvp + home-continue timeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-nightly-logs
          path: |
            desktop-app/dist/smoke-currentDir-timeline.json
            desktop-app/dist/smoke-currentDir-timeline.png
          if-no-files-found: warn

  evaluation-diff:
    name: evaluation-diff
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Download PR evaluation results
        uses: actions/download-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results

      - name: Download main evaluation artifact
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci.yml
          branch: ${{ github.event.repository.default_branch || 'main' }}
          name: evaluation-results
          path: evaluation/baseline
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Diff evaluation vs main (required)
        id: eval_diff
        run: |
          BASE="evaluation/baseline/evaluation-results.json"
          CUR="evaluation/results/evaluation-results.json"
          if [ ! -f "$CUR" ]; then
            echo "::error::Missing PR evaluation-results.json"
            exit 1
          fi
          if [ -f "$BASE" ]; then
            npm run evaluate:diff -- "$BASE" "$CUR"
          else
            echo "::notice::No main evaluation-results artifact yet — self-smoke only (still required job)"
            npm run evaluate:diff -- "$CUR" "$CUR"
          fi

      - name: Comment evaluate:diff Markdown on PR
        if: always() && hashFiles('evaluation/diff.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: evaluate-diff
          path: evaluation/diff.md

  playwright-settings-skipped-notice:
    name: playwright-settings skipped notice
    if: ${{ vars.RUN_PLAYWRIGHT_SETTINGS != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Soft-fail annotation (var not enabled)
        run: |
          echo "::notice::playwright-settings (optional) skipped — RUN_PLAYWRIGHT_SETTINGS is not true"
          echo "::warning title=Settings Playwright held::Keep RUN_PLAYWRIGHT_SETTINGS=false until a warm-cache Settings run is intentionally greened, then flip the repo var."
          {
            echo "## playwright-settings"
            echo ""
            echo "Skipped: \`RUN_PLAYWRIGHT_SETTINGS\` ≠ \`true\` (held)."
          } >> "$GITHUB_STEP_SUMMARY"

  playwright-settings-optional:
    name: playwright-settings (optional)
    if: ${{ vars.RUN_PLAYWRIGHT_SETTINGS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Cache Playwright browsers
        id: pw_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Log Playwright browser cache
        run: |
          HIT="${{ steps.pw_cache.outputs.cache-hit }}"
          echo "Playwright browser cache-hit=${HIT}"
          {
            echo "## Playwright browser cache"
            echo ""
            echo "| Key | Value |"
            echo "| --- | --- |"
            echo "| cache-hit | \`${HIT:-false}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HIT" = "true" ]; then
            echo "::notice::Playwright browsers restored from cache (warm)"
            if ls "$HOME/.cache/ms-playwright"/chromium_headless_shell-*/chrome-headless-shell-*/chrome-headless-shell >/dev/null 2>&1; then
              echo "::notice::Playwright headless-shell restored from cache (warm; skip CDN install)"
              echo "| headless-shell | present |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::notice::Playwright cache hit but headless-shell binary missing — install will fetch"
              echo "| headless-shell | missing |" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::notice::Playwright browser cache miss — install may download Chromium"
            echo "| headless-shell | cache-miss |" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Playwright Chromium
        id: pw_install
        continue-on-error: true
        run: |
          if [ "${{ steps.pw_cache.outputs.cache-hit }}" = "true" ] && \
             ls "$HOME/.cache/ms-playwright"/chromium_headless_shell-*/chrome-headless-shell-*/chrome-headless-shell >/dev/null 2>&1 && \
             ls "$HOME/.cache/ms-playwright"/chromium-*/chrome-*/chrome >/dev/null 2>&1; then
            echo "::notice::Skipping playwright install — chromium + headless-shell warm cache"
            exit 0
          fi
          npx playwright install --with-deps chromium

      - name: Start short-lived vinext (Playwright base)
        id: pw_server
        if: steps.pw_install.outcome == 'success'
        continue-on-error: true
        run: |
          BASE="${PLAYWRIGHT_BASE_URL:-http://localhost:3000}"
          if echo "$BASE" | grep -qE ':(3001)(/|$)'; then
            echo "::notice::PLAYWRIGHT_BASE_URL still points at :3001 — vinext default is :3000; prefer http://localhost:3000"
            BASE="http://localhost:3000"
          fi
          echo "PLAYWRIGHT_BASE_URL=$BASE" >> "$GITHUB_ENV"
          # If an external base is already up, skip starting vinext.
          if curl -sf --max-time 3 "$BASE/api/health" >/dev/null 2>&1 || curl -sf --max-time 3 "$BASE/" >/dev/null 2>&1; then
            echo "::notice::PLAYWRIGHT_BASE_URL already reachable — not starting vinext"
            echo "started=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run dev -- --port 3000 > /tmp/vinext-playwright.log 2>&1 &
          echo $! > /tmp/vinext-playwright.pid
          echo "started=true" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            if curl -sf --max-time 2 "http://localhost:3000/api/health" >/dev/null 2>&1 || curl -sf --max-time 2 "http://localhost:3000/" >/dev/null 2>&1; then
              echo "::notice::vinext ready on :3000 after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::notice::vinext did not become ready — Playwright may soft-skip"
          exit 0
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}
          AUTH_MAGIC_SECRET: "ci-playwright-magic"
          LISTS_ENC_KEY: "ci-playwright-lists-enc"

      # Keep RUN_PLAYWRIGHT_SETTINGS repo var false until this job is green on a warm cache run.
      - name: Narrow Settings screenshot
        id: pw_shot
        if: steps.pw_install.outcome == 'success'
        continue-on-error: true
        run: |
          BASE="${PLAYWRIGHT_BASE_URL:-http://localhost:3000}"
          export PLAYWRIGHT_BASE_URL="$BASE"
          export STRICT_LEAVE_AND_BLOCK=1
          npm run test:playwright:settings
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}
          STRICT_LEAVE_AND_BLOCK: "1"
          RUN_PLAYWRIGHT_SETTINGS: "true"

      - name: Store Halt FRAME Playwright cross-check
        if: steps.pw_install.outcome == 'success'
        run: npm run capture:store-halt-frame:playwright

      - name: China soft-fail (wrong health.service)
        if: steps.pw_install.outcome == 'success'
        run: PLAYWRIGHT_SKIP_WEBSERVER=1 npx playwright test playwright/china-soft-fail.spec.ts

      - name: Halt survey blocks (RiskResult Round-1 UX)
        id: pw_halt_survey
        if: steps.pw_install.outcome == 'success'
        run: |
          BASE="${PLAYWRIGHT_BASE_URL:-http://localhost:3000}"
          export PLAYWRIGHT_BASE_URL="$BASE"
          npm run test:playwright:halt-survey
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}

      - name: Multi-locale switcher
        if: steps.pw_install.outcome == 'success'
        run: |
          BASE="${PLAYWRIGHT_BASE_URL:-http://localhost:3000}"
          export PLAYWRIGHT_BASE_URL="$BASE"
          export PLAYWRIGHT_SKIP_WEBSERVER=1
          npm run test:playwright:locales
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}
          PLAYWRIGHT_SKIP_WEBSERVER: "1"

      - name: Locale recommend soft prompt
        if: steps.pw_install.outcome == 'success'
        run: |
          BASE="${PLAYWRIGHT_BASE_URL:-http://localhost:3000}"
          export PLAYWRIGHT_BASE_URL="$BASE"
          export PLAYWRIGHT_SKIP_WEBSERVER=1
          npm run test:playwright:locale-recommend
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}
          PLAYWRIGHT_SKIP_WEBSERVER: "1"

      - name: Top bar narrow (320/375 screenshots)
        if: steps.pw_install.outcome == 'success'
        run: |
          export PLAYWRIGHT_SKIP_WEBSERVER=1
          npm run test:playwright:top-bar-narrow
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"

      # Soft: live Workers privacy (skip inside spec if unreachable).
      # Covers /en|/pt-PT|/zh-Hans/privacy zero /survey/ links (local fixture: tests/privacy-fixture-no-survey.test.ts).
      - name: Soft privacy-prod (Workers + China Pages no /survey/)
        if: steps.pw_install.outcome == 'success'
        continue-on-error: true
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_HEALTH_URL || 'https://buusdocst.mtsu.workers.dev' }}
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL || 'https://buusdocst.mtsu.workers.dev' }}
          CHINA_PAGES_BASE_URL: ${{ vars.CHINA_PAGES_BASE_URL || 'https://otas0.github.io/buusdocst' }}
        run: npm run test:playwright:privacy

      - name: Extension phishing toast fixture
        if: steps.pw_install.outcome == 'success'
        run: npm run test:playwright:extension-toast-phishing

      - name: Extension popup wordmark (muted u on dark)
        if: steps.pw_install.outcome == 'success'
        run: |
          export PLAYWRIGHT_SKIP_WEBSERVER=1
          npm run test:playwright:extension-popup-wordmark
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"

      - name: Desktop About footer wordmark (muted u)
        if: steps.pw_install.outcome == 'success'
        run: |
          export PLAYWRIGHT_SKIP_WEBSERVER=1
          npm run test:playwright:desktop-about-wordmark
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"

      - name: Desktop Halt ignore-risk
        if: steps.pw_install.outcome == 'success'
        run: npm run test:playwright:desktop-halt-ignore-risk

      - name: Account sync (cancelled — soft skip)
        id: pw_account
        if: steps.pw_install.outcome == 'success'
        run: npx playwright test playwright/account-sync.spec.ts

      # Optional live website components (vinext). Soft-skip inside specs if base unreachable.
      - name: Live RiskResult Block-on-desktop (optional)
        id: pw_risk_live
        if: steps.pw_install.outcome == 'success'
        continue-on-error: true
        run: |
          BASE="${PLAYWRIGHT_BASE_URL:-http://localhost:3000}"
          export PLAYWRIGHT_BASE_URL="$BASE"
          npm run test:playwright:risk-result-desktop-block-live
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}

      - name: Live Settings ready-to-promote (optional, real SettingsPanel)
        id: pw_settings_live
        if: steps.pw_install.outcome == 'success'
        continue-on-error: true
        run: |
          BASE="${PLAYWRIGHT_BASE_URL:-http://localhost:3000}"
          export PLAYWRIGHT_BASE_URL="$BASE"
          npm run test:playwright:settings-mac-ready-to-promote-live
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}

      - name: Strict deep-link + double-nav (hard fail)
        id: pw_strict
        if: steps.pw_install.outcome == 'success'
        run: |
          BASE="${PLAYWRIGHT_BASE_URL:-http://localhost:3000}"
          if ! curl -sf --max-time 3 "$BASE/" >/dev/null 2>&1 && ! curl -sf --max-time 3 "$BASE/api/health" >/dev/null 2>&1; then
            echo "::error::Playwright base unreachable after vinext step — cannot run STRICT Settings cases"
            exit 1
          fi
          export PLAYWRIGHT_BASE_URL="$BASE"
          export STRICT_LEAVE_AND_BLOCK=1
          export CI=true
          # Single source of title fragments — STRICT_G is joined from STRICT_TITLES (keep them identical).
          # Never literal-edit STRICT_G=… — only append/rename entries in STRICT_TITLES below.
          # Soft-asserts (legend bbox, intel More, probe-blocked filter labels, leave-chip i18n)
          # stay inside existing titles — do not add a STRICT title for soft-only checks.
          # CDN href title: change STRICT_MAC_SOURCE_TITLE only (array + soft-assert docs use it).
          # Documents settings-desktop-download-mac href + aria-describedby (no aria-description / title).
          STRICT_MAC_SOURCE_TITLE="mac-source visible when mirror stubbed via fixture (CDN href)"
          echo "STRICT_MAC_SOURCE_TITLE=$STRICT_MAC_SOURCE_TITLE"
          STRICT_TITLES=(
            "block-lists note links"
            "click Settings nav twice"
            "result Settings link scrolls"
            "result block-lists settings link href"
            "user-block-evidence and personal-list-leave-note"
            "AppShell check request body never includes personalListBlocked"
            "nunca saem do dispositivo"
            "Clear ring control"
            "timing-flag-chips ambiguousProbeStatus after mocked 403"
            "settings legend ambiguousProbeStatus label matches i18n"
            "screenshot checklist + CSV filter"
            "opens privacy honest-limits without full reload"
            "locale toggle from Settings keeps #settings-desktop"
            "mac-source hidden when mirror empty"
            "$STRICT_MAC_SOURCE_TITLE"
          )
          STRICT_G=$(IFS='|'; echo "${STRICT_TITLES[*]}")
          LIST_OUT=$(npx playwright test playwright/settings-narrow.spec.ts playwright/settings-honest-limits.spec.ts -g "$STRICT_G" --list 2>&1 || true)
          echo "$LIST_OUT"
          # Guard against title renames leaving the -g filter matching nothing.
          MATCH_COUNT=$(echo "$LIST_OUT" | grep -cE 'settings-(narrow|honest-limits)\.spec\.ts:' || true)
          if [ "${MATCH_COUNT:-0}" -lt 1 ]; then
            echo "::error::Strict Playwright -g matched zero tests — update the filter after renaming specs"
            {
              echo "## Strict Playwright filter"
              echo ""
              echo "Matched **0** tests for \`-g\` — job failed as a rename guard."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          MISSING=""
          for title in "${STRICT_TITLES[@]}"; do
            if ! echo "$LIST_OUT" | grep -Fq "$title"; then
              echo "::error::Strict Playwright --list missing expected title: $title"
              MISSING="${MISSING}${MISSING:+, }$title"
            fi
          done
          # Dedicated rename guard: STRICT_MAC_SOURCE_TITLE must appear as an exact title line.
          if ! echo "$LIST_OUT" | grep -Fq "$STRICT_MAC_SOURCE_TITLE"; then
            # Annotation + check-run title hint; follow-up step name also surfaces the title.
            echo "::error title=STRICT_MAC_SOURCE_TITLE::Playwright --list lacks exact title: $STRICT_MAC_SOURCE_TITLE"
            echo "::notice title=STRICT_MAC_SOURCE_TITLE::$STRICT_MAC_SOURCE_TITLE"
            echo "::notice::STRICT_MAC_SOURCE_TITLE=$STRICT_MAC_SOURCE_TITLE"
            echo "::notice::Follow-up step name: STRICT_MAC_SOURCE_TITLE missing: $STRICT_MAC_SOURCE_TITLE"
            echo "strict_mac_source_missing=1" >> "$GITHUB_OUTPUT"
            echo "strict_mac_source_title=$STRICT_MAC_SOURCE_TITLE" >> "$GITHUB_OUTPUT"
            {
              echo "## Strict Playwright filter"
              echo ""
              echo "Missing exact title line for \`STRICT_MAC_SOURCE_TITLE\`:"
              echo ""
              echo "\`$STRICT_MAC_SOURCE_TITLE\`"
              echo ""
              echo "See [CI STRICT run-name](desktop-app/RELEASE.md#ci-strict-run-name) — mid-job \`run-name\` rename is impossible; failure is via this guard + follow-up step."
              echo ""
              echo "Follow-up step name (Actions UI): \`STRICT_MAC_SOURCE_TITLE missing: $STRICT_MAC_SOURCE_TITLE\`"
              echo ""
              echo "### Titles"
              echo ""
              echo "- STRICT_MAC_SOURCE_TITLE=\`$STRICT_MAC_SOURCE_TITLE\`"
              echo ""
              echo "$LIST_OUT" | grep -E 'settings-(narrow|honest-limits)\.spec\.ts:' | sed 's/^/- /' || true
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          EXPECTED_COUNT=${#STRICT_TITLES[@]}
          if [ -n "$MISSING" ]; then
            {
              echo "## Strict Playwright filter"
              echo ""
              echo "Matched **${MATCH_COUNT}** line(s) but missing expected title(s): \`${MISSING}\`"
              echo ""
              echo "### Titles"
              echo ""
              echo "$LIST_OUT" | grep -E 'settings-(narrow|honest-limits)\.spec\.ts:' | sed 's/^/- /' || true
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${MATCH_COUNT}" -ne "${EXPECTED_COUNT}" ]; then
            echo "::error::Strict Playwright MATCH_COUNT (${MATCH_COUNT}) != STRICT_TITLES length (${EXPECTED_COUNT})"
            {
              echo "## Strict Playwright filter"
              echo ""
              echo "Matched **${MATCH_COUNT}** line(s) but expected **${EXPECTED_COUNT}** (STRICT_TITLES length)."
              echo ""
              echo "### Titles"
              echo ""
              echo "$LIST_OUT" | grep -E 'settings-(narrow|honest-limits)\.spec\.ts:' | sed 's/^/- /' || true
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::notice::Strict Playwright matched ${MATCH_COUNT}/${EXPECTED_COUNT} (EXPECTED_COUNT=${EXPECTED_COUNT})"
          {
            echo "## Strict Playwright filter"
            echo ""
            echo "Matched **${MATCH_COUNT}** / **${EXPECTED_COUNT}** (EXPECTED_COUNT = STRICT_TITLES length); all expected titles present."
            echo ""
            echo "### Titles"
            echo ""
            echo "$LIST_OUT" | grep -E 'settings-(narrow|honest-limits)\.spec\.ts:' | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          npx playwright test playwright/settings-narrow.spec.ts playwright/settings-honest-limits.spec.ts -g "$STRICT_G"
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'http://localhost:3000' }}
          STRICT_LEAVE_AND_BLOCK: "1"
          CI: true

      # Surfaces STRICT_MAC_SOURCE_TITLE in the Actions step list (run-name cannot change mid-job).
      - name: "STRICT_MAC_SOURCE_TITLE missing: ${{ steps.pw_strict.outputs.strict_mac_source_title }}"
        if: failure() && steps.pw_strict.outputs.strict_mac_source_missing == '1'
        run: |
          echo "::error title=STRICT_MAC_SOURCE_TITLE::${{ steps.pw_strict.outputs.strict_mac_source_title }}"
          exit 1

      - name: Upload Playwright report on strict failure
        if: failure() && steps.pw_strict.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-strict-report
          path: |
            playwright/report/**
            playwright/output/**
          if-no-files-found: ignore

      - name: Stop short-lived vinext
        if: always() && steps.pw_server.outputs.started == 'true'
        continue-on-error: true
        run: |
          if [ -f /tmp/vinext-playwright.pid ]; then
            kill "$(cat /tmp/vinext-playwright.pid)" 2>/dev/null || true
          fi
      - name: Notice if Chromium install failed
        if: steps.pw_install.outcome != 'success'
        run: echo "::notice::Playwright Chromium install failed — optional Settings screenshot skipped (job still green)"
      - name: Soft-fail if thumb missing but full PNG exists
        if: steps.pw_install.outcome == 'success'
        run: |
          FULL=playwright/output/settings-narrow-pt.png
          THUMB=playwright/output/settings-narrow-pt-thumb.png
          if [ -f "$FULL" ] && [ ! -f "$THUMB" ]; then
            echo "::notice::png-max-width thumb helper failed or skipped — full PNG kept; job stays green (no ImageMagick)"
          fi
          if [ "${{ steps.pw_shot.outcome }}" != "success" ] && [ -f "$FULL" ]; then
            echo "::notice::Playwright settings screenshot soft-failed but full PNG exists"
          elif [ "${{ steps.pw_shot.outcome }}" != "success" ]; then
            echo "::notice::Playwright settings screenshot soft-failed (strict nav step is separate)"
          fi
      - name: Upload screenshot (full PNG even on soft-fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-narrow-pt
          path: playwright/output/**
          if-no-files-found: ignore
      - name: Job summary screenshot thumbnail
        if: steps.pw_install.outcome == 'success' && hashFiles('playwright/output/settings-narrow-pt.png') != ''
        run: |
          {
            echo "## Narrow Settings screenshot (pt-PT)"
            echo ""
            echo "Full PNG is in artifact \`settings-narrow-pt\` (thumb from scripts/png-max-width.mjs — no ImageMagick)."
            echo "Also includes \`settings-block-lists-live.png\` when Leave-and-block nav ran."
            echo ""
            THUMB=playwright/output/settings-narrow-pt-thumb.png
            SRC=playwright/output/settings-narrow-pt.png
            if [ -f "$THUMB" ]; then SRC="$THUMB"; fi
            SIZE=$(wc -c < "$SRC" | tr -d ' ')
            if [ "$SIZE" -lt 200000 ]; then
              echo "![settings-narrow-pt](data:image/png;base64,$(base64 -w0 "$SRC"))"
            else
              echo "_Screenshot ${SIZE} bytes — open the artifact (too large to inline)._"
            fi
            if [ -f playwright/output/settings-block-lists-live.png ]; then
              echo ""
              echo "### settings-block-lists-live"
              echo ""
              LIVE_SIZE=$(wc -c < playwright/output/settings-block-lists-live.png | tr -d ' ')
              if [ "$LIVE_SIZE" -lt 200000 ]; then
                echo "![settings-block-lists-live](data:image/png;base64,$(base64 -w0 playwright/output/settings-block-lists-live.png))"
              else
                echo "_Live deep-link PNG ${LIVE_SIZE} bytes — open the artifact._"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"