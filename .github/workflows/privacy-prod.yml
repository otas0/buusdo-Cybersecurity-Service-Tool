# Privacy pages smoke against production (CF-reachable ubuntu).
# - Manual: workflow_dispatch
# - After Deploy Cloudflare: workflow_call with origin URL

name: Privacy prod smoke

on:
  schedule:
    # Nightly 05:45 UTC — CF-reachable ubuntu Playwright privacy-prod
    - cron: "45 5 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Origin (https://…)"
        required: false
        default: "https://buusdocst.mtsu.workers.dev"
  workflow_call:
    inputs:
      url:
        description: "Origin (https://…)"
        required: false
        type: string
        default: "https://buusdocst.mtsu.workers.dev"

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve URL
        id: origin
        run: |
          IN="${{ inputs.url }}"
          if [ -z "$IN" ]; then IN="${{ github.event.inputs.url }}"; fi
          if [ -z "$IN" ]; then IN="https://buusdocst.mtsu.workers.dev"; fi
          echo "url=$(echo "$IN" | sed 's:/*$::')" >> "$GITHUB_OUTPUT"
      - name: Download prior soft-live-hash-streak artifact (cross-run)
        id: prior_streak
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/prior-soft-live-hash-streak
          # Best-effort: latest non-expired artifact named soft-live-hash-streak from this repo.
          ART=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=soft-live-hash-streak&per_page=10" \
            --jq '[.artifacts[] | select(.expired==false)] | first | .id // empty' 2>/dev/null || true)
          if [ -n "$ART" ]; then
            if gh api "repos/${{ github.repository }}/actions/artifacts/${ART}/zip" > /tmp/prior-soft-live.zip 2>/tmp/prior-soft-live.err; then
              unzip -o /tmp/prior-soft-live.zip -d /tmp/prior-soft-live-hash-streak
              echo "Downloaded prior artifact id=$ART via gh api"
              find /tmp/prior-soft-live-hash-streak -name 'soft-live-hash-streak.json' -print
              exit 0
            fi
            echo "gh api zip failed (forks often lack permission) — trying run download fallback"
            cat /tmp/prior-soft-live.err || true
          else
            echo "No artifact id from gh api — trying run download fallback (forks)"
          fi
          # Fallback when gh api lacks permission on forks: resolve latest successful run + download-artifact.
          RUN=$(gh run list --workflow=privacy-prod.yml --status=success --limit 5 --json databaseId \
            --jq '.[0].databaseId // empty' 2>/dev/null || true)
          if [ -z "$RUN" ]; then
            RUN=$(gh run list --workflow=privacy-prod.yml --limit 5 --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion=="success")] | first | .databaseId // empty' 2>/dev/null || true)
          fi
          if [ -n "$RUN" ]; then
            if gh run download "$RUN" -n soft-live-hash-streak -D /tmp/prior-soft-live-hash-streak 2>/tmp/prior-soft-live-dl.err; then
              echo "Downloaded prior via gh run download run=$RUN"
              find /tmp/prior-soft-live-hash-streak -name 'soft-live-hash-streak.json' -print
              exit 0
            fi
            echo "gh run download soft-fail:"
            cat /tmp/prior-soft-live-dl.err || true
          fi
          echo "No prior soft-live-hash-streak artifact — starting from baseline"
          exit 0
      - name: Playwright privacy
        id: pw_privacy
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: ${{ steps.origin.outputs.url }}
          SOFT_LIVE_HASH_OUTCOME_PATH: ${{ github.workspace }}/ci/soft-live-hash-inview-outcome.json
        run: npm run test:playwright:privacy
      - name: Playwright /zh → /zh-Hans alias (soft skip if unreachable)
        id: pw_zh_alias
        if: always() && steps.pw_privacy.outcome != 'cancelled'
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: ${{ steps.origin.outputs.url }}
        run: npm run test:playwright:zh-alias
      - name: Soft-live hash streak (extension unpark gate)
        id: soft_live_streak
        if: always() && steps.pw_privacy.outcome != 'cancelled'
        run: |
          PRIOR=""
          if [ -f /tmp/prior-soft-live-hash-streak/soft-live-hash-streak.json ]; then
            PRIOR=/tmp/prior-soft-live-hash-streak/soft-live-hash-streak.json
          elif [ -f /tmp/prior-soft-live-hash-streak/ci/soft-live-hash-streak.json ]; then
            PRIOR=/tmp/prior-soft-live-hash-streak/ci/soft-live-hash-streak.json
          fi
          # Reset when suite hard-fails OR hash in-view soft-failed (even if suite soft-green).
          INVIEW_OK=true
          if [ -f ci/soft-live-hash-inview-outcome.json ]; then
            INVIEW_OK=$(node -e 'const j=JSON.parse(require("fs").readFileSync("ci/soft-live-hash-inview-outcome.json","utf8")); console.log(j.ok===true?"true":"false")')
          fi
          if [ "${{ steps.pw_privacy.outcome }}" = "success" ] && [ "$INVIEW_OK" = "true" ]; then
            if [ -n "$PRIOR" ]; then
              node scripts/bump-soft-live-hash-streak.mjs --green --from-artifact "$PRIOR"
            else
              node scripts/bump-soft-live-hash-streak.mjs --green
            fi
          else
            echo "Resetting soft-live streak (pw=${{ steps.pw_privacy.outcome }} inview_ok=$INVIEW_OK)"
            node scripts/bump-soft-live-hash-streak.mjs --reset
          fi
          STREAK=$(node -e 'const j=require("./ci/soft-live-hash-streak.json"); console.log(j.streak)')
          echo "streak=$STREAK" >> "$GITHUB_OUTPUT"
          INVIEW_LINE="inview: (no outcome file)"
          if [ -f ci/soft-live-hash-inview-outcome.json ]; then
            INVIEW_LINE=$(node -e 'const j=JSON.parse(require("fs").readFileSync("ci/soft-live-hash-inview-outcome.json","utf8")); const oks=(j.oks||[]).length; const fails=(j.fails||[]).length; console.log(`inview: ok=${j.ok===true} oks=${oks} fails=${fails}`)')
          fi
          echo "inview_line=$INVIEW_LINE" >> "$GITHUB_OUTPUT"
          {
            echo "### soft-live hash (extension unpark)"
            echo ""
            echo '```'
            node scripts/bump-soft-live-hash-streak.mjs --print
            echo "$INVIEW_LINE"
            echo '```'
            echo ""
            echo "- Hard PR gate (\`assert-extension-ui-unpark\`) stays soft until schedule proves streak≥3 (then set \`EXT_UI_UNPARK_HARD=1\`)."
            echo "- Hash in-view soft-fail resets streak even when the suite exits soft-green."
          } >> "$GITHUB_STEP_SUMMARY"
          node scripts/append-soft-live-streak-chart.mjs || true
      - name: Upload soft-live hash streak artifact
        if: always() && steps.soft_live_streak.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: soft-live-hash-streak
          path: ci/soft-live-hash-streak.json
          if-no-files-found: ignore
          # 90 days once EXT_UI_UNPARK_HARD=1 (docs/CI.md); 30 while soft.
          retention-days: ${{ vars.EXT_UI_UNPARK_HARD == '1' && 90 || 30 }}
      - name: Upload soft-live hash in-view outcome (schedule debug)
        if: always() && steps.pw_privacy.outcome != 'cancelled'
        uses: actions/upload-artifact@v4
        with:
          name: soft-live-hash-inview-outcome
          path: ci/soft-live-hash-inview-outcome.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Soft unpark probe (deferred hard until streak≥3)
        if: always() && steps.soft_live_streak.outcome == 'success'
        continue-on-error: true
        env:
          SOFT_LIVE_HASH_GREEN_STREAK: ${{ steps.soft_live_streak.outputs.streak }}
        run: |
          node scripts/assert-extension-ui-unpark.mjs || true
          echo "::notice::assert-extension-ui-unpark soft probe (hard PR gate after streak≥3 on schedule)"
          if [ "${{ steps.soft_live_streak.outputs.streak }}" -ge 3 ] 2>/dev/null; then
            echo "::notice::streak≥3 — ready to flip repo var EXT_UI_UNPARK_HARD=1 (document date in docs/CI.md)"
          fi
      - name: Soft China mirrorUrl probe (skip when empty)
        id: soft_china_mirror
        if: always() && steps.pw_privacy.outcome != 'cancelled'
        continue-on-error: true
        run: node scripts/soft-china-mirror-probe.mjs
      - name: Job Summary — soft-live fail → ARCHIVE listing checklist
        if: failure() || steps.pw_privacy.outcome == 'failure'
        run: |
          {
            echo "### soft-live failure triage"
            echo ""
            echo "- Playwright privacy soft-live failed (or suite hard-failed)."
            echo "- China listing paste + screenshot archive checklist:"
            echo "  [\`docs/store-screenshots/ARCHIVE-china-listing-paste.md\`](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/store-screenshots/ARCHIVE-china-listing-paste.md)"
            echo "- Report artifact (if uploaded): \`privacy-prod-playwright-report\`"
            echo "- Mainland promo assert / copy: [\`docs/PUBLIC_PROMOTION.md\`](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/PUBLIC_PROMOTION.md) 「面向大陆」"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright HTML report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-prod-playwright-report
          path: |
            playwright/report/**
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14
