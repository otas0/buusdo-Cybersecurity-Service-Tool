# Privacy pages smoke against production (CF-reachable ubuntu).
# - Manual: workflow_dispatch
# - After Deploy Cloudflare: workflow_call with origin URL

name: Privacy prod smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Origin (https://…)"
        required: false
        default: "https://buusdocst.mtsu.workers.dev"
  workflow_call:
    inputs:
      url:
        description: "Origin (https://…)"
        required: false
        type: string
        default: "https://buusdocst.mtsu.workers.dev"

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve URL
        id: origin
        run: |
          IN="${{ inputs.url }}"
          if [ -z "$IN" ]; then IN="${{ github.event.inputs.url }}"; fi
          if [ -z "$IN" ]; then IN="https://buusdocst.mtsu.workers.dev"; fi
          echo "url=$(echo "$IN" | sed 's:/*$::')" >> "$GITHUB_OUTPUT"
      - name: Playwright privacy
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: ${{ steps.origin.outputs.url }}
        run: npm run test:playwright:privacy
      - name: Playwright /zh → /zh-Hans alias (soft skip if unreachable)
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_BASE_URL: ${{ steps.origin.outputs.url }}
        run: npm run test:playwright:zh-alias