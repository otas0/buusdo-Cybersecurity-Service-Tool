# Manual Cloudflare Workers deploy (workflow_dispatch).
# Setup guide: docs/DEPLOY_SECRETS.md
# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Edit Cloudflare Workers template (or custom Account.Workers Scripts:Edit)
#   CLOUDFLARE_ACCOUNT_ID  — dash.cloudflare.com/<id> (also: npx wrangler whoami)
# Optional variable:
#   NEXT_PUBLIC_SITE_URL   — https://YOUR_DOMAIN or https://….workers.dev (no trailing slash)
#
# After first success: locally run
#   npm run production:origin -- https://…
# then commit the updated origin files / README.
# Custom domain second deploy: docs/CUSTOM_DOMAIN_REDEPLOY.md
# Local laptop timeouts ≠ outage: docs/LOCAL_CF_CONNECTIVITY.md


name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "NEXT_PUBLIC_SITE_URL override (https://…); empty = repo variable"
        required: false
        default: ""
      run_check_smoke:
        description: "Also POST /api/check smoke after deploy"
        required: false
        type: boolean
        default: true
      run_privacy_smoke:
        description: "After success, call Privacy prod smoke (Playwright)"
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    name: deploy:cloudflare
    runs-on: ubuntu-latest
    outputs:
      site_url: ${{ steps.site.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve site URL
        id: site
        run: |
          OVERRIDE="${{ github.event.inputs.site_url }}"
          VAR="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          # Default public origin until custom domain replaces it (docs/CUSTOM_DOMAIN_REDEPLOY.md).
          DEFAULT="https://pcpd.mtsu.workers.dev"
          if [ -n "$OVERRIDE" ]; then
            URL="$OVERRIDE"
          elif [ -n "$VAR" ]; then
            URL="$VAR"
          else
            URL="$DEFAULT"
            echo "::notice::NEXT_PUBLIC_SITE_URL unset — defaulting to $DEFAULT (set repo variable to override)"
          fi
          URL=$(echo "$URL" | tr -d '[:space:]' | sed 's:/*$::')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "NEXT_PUBLIC_SITE_URL=$URL" >> "$GITHUB_ENV"
          echo "::notice::NEXT_PUBLIC_SITE_URL=$URL"


      - name: Install
        run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          npm run deploy:cloudflare

      - name: Health smoke
        if: steps.site.outputs.url != ''
        env:
          HEALTH_BASE_URL: ${{ steps.site.outputs.url }}
        run: npm run health:prod -- --url "$HEALTH_BASE_URL"

      - name: Check smoke
        if: steps.site.outputs.url != '' && github.event.inputs.run_check_smoke == 'true'
        env:
          HEALTH_BASE_URL: ${{ steps.site.outputs.url }}
        run: npm run check:prod -- --url "$HEALTH_BASE_URL"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy Cloudflare"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| NEXT_PUBLIC_SITE_URL | \`${{ steps.site.outputs.url }}\` |"
            echo "| command | \`npm run deploy:cloudflare\` |"
            echo ""
            echo "Custom domain next: docs/CUSTOM_DOMAIN_REDEPLOY.md (also update PUBLIC_PROMOTION.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  privacy:
    name: privacy-prod (after deploy)
    needs: deploy
    if: github.event.inputs.run_privacy_smoke == 'true'
    uses: ./.github/workflows/privacy-prod.yml
    with:
      url: ${{ needs.deploy.outputs.site_url }}