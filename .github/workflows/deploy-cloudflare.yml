# Manual Cloudflare Workers deploy (workflow_dispatch).
# Setup guide: docs/DEPLOY_SECRETS.md
# Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Edit Cloudflare Workers template (or custom Account.Workers Scripts:Edit)
#   CLOUDFLARE_ACCOUNT_ID  — dash.cloudflare.com/<id> (also: npx wrangler whoami)
# Optional variable:
#   NEXT_PUBLIC_SITE_URL   — https://YOUR_DOMAIN or https://….workers.dev (no trailing slash)
#   STAGING_HEALTH_URL     — after first staging deploy; must ≠ PRODUCTION_HEALTH_URL
#   PLAYWRIGHT_PREVIEW_BASE_URL — optional preview fallback (prefer dedicated buusdocst-preview Worker)
#
# After first success: locally run
#   npm run production:origin -- https://…
# then commit the updated origin files / README.
# Custom domain second deploy: docs/CUSTOM_DOMAIN_REDEPLOY.md (hold until Account gate + POST_LAUNCH_48H).
# Local laptop timeouts ≠ outage: docs/LOCAL_CF_CONNECTIVITY.md — trust Actions only.
#
# Soft EU locale 200: always soft (continue-on-error) for production + staging — locale-pack
# push deploys must not hard-fail the workflow on a single locale blip. Soft-live Halt Playwright
# is opt-in via workflow_dispatch `run_soft_live_halt` (not on CI unit matrix). See docs/I18N.md.


name: Deploy Cloudflare

on:
  # Locale / i18n bag changes must ship to Workers without a manual dispatch.
  push:
    branches: [main, master]
    paths:
      - "i18n/packs/**"
      - "i18n/messages.ts"
      - "i18n/locales.ts"
      - "i18n/pack-index.ts"
      - "i18n/core-keys.ts"
  workflow_dispatch:
    inputs:
      target:
        description: "Worker target (production = buusdocst; staging = buusdocst-staging)"
        required: true
        type: choice
        options:
          - production
          - staging
        default: production
      site_url:
        description: "Health/smoke origin override (https://…); empty = repo var / default"
        required: false
        default: ""
      run_check_smoke:
        description: "Also POST /api/check smoke after deploy (production only)"
        required: false
        type: boolean
        default: true
      run_privacy_smoke:
        description: "After success, call Privacy prod smoke (production only)"
        required: false
        type: boolean
        default: true
      run_soft_live_halt:
        description: "After deploy, soft-run Playwright live Halt evidence against Workers"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: deploy:cloudflare
    runs-on: ubuntu-latest
    outputs:
      site_url: ${{ steps.site.outputs.url }}
      target: ${{ steps.site.outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve site URL + target
        id: site
        run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TARGET" ]; then TARGET="production"; fi
          OVERRIDE="${{ github.event.inputs.site_url }}"
          VAR="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          STAGING_VAR="${{ vars.STAGING_HEALTH_URL }}"
          # Default public origin until custom domain replaces it (docs/CUSTOM_DOMAIN_REDEPLOY.md).
          DEFAULT="https://buusdocst.mtsu.workers.dev"
          if [ "$TARGET" = "staging" ]; then
            if [ -n "$OVERRIDE" ]; then
              URL="$OVERRIDE"
            elif [ -n "$STAGING_VAR" ]; then
              URL="$STAGING_VAR"
            else
              # First staging deploy: health step skipped until STAGING_HEALTH_URL is set.
              URL=""
              echo "::notice::STAGING_HEALTH_URL unset — deploy will run; set the var to the printed workers.dev URL after first success (soft EU job will skip until then)"
            fi
          else
            if [ -n "$OVERRIDE" ]; then
              URL="$OVERRIDE"
            elif [ -n "$VAR" ]; then
              URL="$VAR"
            else
              URL="$DEFAULT"
              echo "::notice::NEXT_PUBLIC_SITE_URL unset — defaulting to $DEFAULT (set repo variable to override)"
            fi
          fi
          URL=$(echo "$URL" | tr -d '[:space:]' | sed 's:/*$::')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then
            echo "NEXT_PUBLIC_SITE_URL=$URL" >> "$GITHUB_ENV"
            echo "::notice::target=$TARGET NEXT_PUBLIC_SITE_URL=$URL"
          else
            echo "::notice::target=$TARGET (no smoke URL yet — first staging? set STAGING_HEALTH_URL after wrangler prints the workers.dev host)"
          fi

      - name: Install
        run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ steps.site.outputs.target }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/DEPLOY_SECRETS.md)"
            exit 1
          fi
          if [ "$TARGET" = "staging" ]; then
            npm run deploy:cloudflare:staging
          else
            npm run deploy:cloudflare
          fi

      - name: Health smoke
        if: steps.site.outputs.url != ''
        env:
          HEALTH_BASE_URL: ${{ steps.site.outputs.url }}
          TARGET: ${{ steps.site.outputs.target }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "staging" ]; then
            # Account sync cancelled — require accountSyncEnabled false on staging.
            STAGING_HEALTH_URL="$HEALTH_BASE_URL" \
              PRODUCTION_HEALTH_URL="${{ vars.PRODUCTION_HEALTH_URL }}" \
              GITHUB_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              node scripts/assert-staging-health.mjs
          else
            npm run health:prod -- --url "$HEALTH_BASE_URL"
          fi

      - name: Check smoke
        # Push (locale packs) defaults on; workflow_dispatch respects the input.
        if: >
          steps.site.outputs.url != '' && steps.site.outputs.target == 'production' &&
          (github.event_name == 'push' || github.event.inputs.run_check_smoke == 'true')
        env:
          HEALTH_BASE_URL: ${{ steps.site.outputs.url }}
        run: npm run check:prod -- --url "$HEALTH_BASE_URL"

  eu-locale-routes:
    name: eu-locale-routes-200 (soft)
    needs: deploy
    # Keep soft for production + staging (continue-on-error). Eval 2026-11-08: do not hard-fail
    # production on a single locale blip — locale-pack push deploys would otherwise flake.
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Pure Node script — no npm install.
      - name: Europe locale routes 200
        id: eu
        env:
          PLAYWRIGHT_LIVE_BASE_URL: ${{ needs.deploy.outputs.site_url }}
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          PLAYWRIGHT_PREVIEW_BASE_URL: ${{ vars.PLAYWRIGHT_PREVIEW_BASE_URL }}
          HEALTH_TIMEOUT_MS: "8000"
          LOCALE_TIMEOUT_MS: "12000"
          EU_LOCALE_CONCURRENCY: "6"
          EU_FAIL_ARTIFACT: ${{ runner.temp }}/eu-locale-failures.md
          WORKERS_TIMEOUT_WEBHOOK_URL: ${{ secrets.WORKERS_TIMEOUT_WEBHOOK_URL }}
          DEPLOY_TARGET: ${{ needs.deploy.outputs.target }}
        run: |
          set -euo pipefail
          if [ -z "${PLAYWRIGHT_LIVE_BASE_URL:-}" ]; then
            if [ -n "${STAGING_HEALTH_URL:-}" ] && [ "${DEPLOY_TARGET}" = "staging" ]; then
              export PLAYWRIGHT_LIVE_BASE_URL="$STAGING_HEALTH_URL"
            elif [ -n "${PRODUCTION_HEALTH_URL:-}" ]; then
              export PLAYWRIGHT_LIVE_BASE_URL="$PRODUCTION_HEALTH_URL"
            fi
          fi
          if [ -z "${PLAYWRIGHT_LIVE_BASE_URL:-}" ] && [ "${DEPLOY_TARGET}" = "staging" ]; then
            echo "::notice::skipped-live [eu-routes-200] staging first deploy has no smoke URL yet — set STAGING_HEALTH_URL to the wrangler workers.dev host, then re-run Deploy or this soft job"
          fi
          node scripts/assert-eu-locale-routes-200.mjs
          echo "::notice::eu-locale-routes-200 finished (soft job; continue-on-error for production+staging)"
      - name: Upload EU failure table
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eu-locale-failures
          path: ${{ runner.temp }}/eu-locale-failures.md
          if-no-files-found: ignore
          retention-days: 7

  soft-live-halt:
    name: soft-live Halt (Playwright)
    needs: deploy
    if: >
      needs.deploy.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_soft_live_halt == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Soft-live Halt evidence
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
          PLAYWRIGHT_LIVE_BASE_URL: ${{ needs.deploy.outputs.site_url }}
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          PLAYWRIGHT_PREVIEW_BASE_URL: ${{ vars.PLAYWRIGHT_PREVIEW_BASE_URL }}
          HEALTH_TIMEOUT_MS: "8000"
          WORKERS_TIMEOUT_WEBHOOK_URL: ${{ secrets.WORKERS_TIMEOUT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PLAYWRIGHT_LIVE_BASE_URL:-}" ]; then
            if [ "${{ needs.deploy.outputs.target }}" = "staging" ] && [ -n "${STAGING_HEALTH_URL:-}" ]; then
              export PLAYWRIGHT_LIVE_BASE_URL="$STAGING_HEALTH_URL"
            elif [ -n "${PRODUCTION_HEALTH_URL:-}" ]; then
              export PLAYWRIGHT_LIVE_BASE_URL="$PRODUCTION_HEALTH_URL"
            fi
          fi
          if [ -z "${PLAYWRIGHT_LIVE_BASE_URL:-}" ]; then
            echo "::notice::skipped-live soft-live Halt — no origin URL (set site_url / STAGING_HEALTH_URL / PRODUCTION_HEALTH_URL)"
            exit 0
          fi
          npx playwright test playwright/risk-result-zh-hans-evidence.spec.ts -g "live Halt evidence"
          echo "::notice::soft-live Halt finished (continue-on-error)"

  deploy-summary:
    name: Deploy Summary
    needs: [deploy, eu-locale-routes, soft-live-halt]
    if: always() && needs.deploy.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Download EU failure table
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: eu-locale-failures
          path: ${{ runner.temp }}/eu-fail
      - name: Write summary (failures pinned first)
        env:
          TARGET: ${{ needs.deploy.outputs.target }}
          SMOKE_URL: ${{ needs.deploy.outputs.site_url }}
          EU_RESULT: ${{ needs.eu-locale-routes.result }}
          SOFT_LIVE_RESULT: ${{ needs.soft-live-halt.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          FAIL_MD="${{ runner.temp }}/eu-fail/eu-locale-failures.md"
          {
            if [ -f "$FAIL_MD" ]; then
              cat "$FAIL_MD"
              echo ""
            elif [ "$EU_RESULT" = "failure" ]; then
              echo "## EU locale route failures"
              echo ""
              echo "_Soft job failed but no artifact was uploaded — open soft job logs below._"
              echo ""
            fi
            echo "## Deploy Cloudflare"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| deploy | \`$DEPLOY_RESULT\` |"
            echo "| eu-locale soft | \`$EU_RESULT\` — [run logs]($RUN_URL) (job \`eu-locale-routes-200 (soft)\`) |"
            echo "| soft-live Halt | \`$SOFT_LIVE_RESULT\` — [run logs]($RUN_URL) (job \`soft-live Halt (Playwright)\`; skipped unless workflow_dispatch + run_soft_live_halt) |"
            echo "| target | \`$TARGET\` |"
            echo "| smoke URL | \`$SMOKE_URL\` |"
            CMD="npm run deploy:cloudflare"
            if [ "$TARGET" = "staging" ]; then CMD="npm run deploy:cloudflare:staging"; fi
            echo "| command | \`$CMD\` |"
            echo ""
            if [ "$TARGET" = "staging" ]; then
              echo "Staging: Account sync is **cancelled** (\`accountSyncEnabled\` must stay false). Soft EU stays \`continue-on-error\` (same as production)."
              if [ -z "$SMOKE_URL" ]; then
                echo ""
                echo "> **First staging deploy:** smoke URL empty — set \`STAGING_HEALTH_URL\` to the wrangler \`*.workers.dev\` host, then re-run Deploy so soft EU / soft-live can probe."
              fi
            else
              echo "Custom domain: **hold** until docs/POST_LAUNCH_48H.md (docs/CUSTOM_DOMAIN_REDEPLOY.md)."
              echo ""
              echo "EU soft job stays soft on production (eval 2026-11-08): hard-fail would flake locale-pack push deploys."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  privacy:
    name: privacy-prod (after deploy)
    needs: deploy
    if: >
      needs.deploy.outputs.target == 'production' &&
      (github.event_name == 'push' || github.event.inputs.run_privacy_smoke == 'true')
    uses: ./.github/workflows/privacy-prod.yml
    with:
      url: ${{ needs.deploy.outputs.site_url }}
