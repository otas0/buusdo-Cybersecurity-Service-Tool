<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>buusdo Cybersecurity Service Tool</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <h1 id="appTitle" class="brand-lockup" aria-label="buusdo Cybersecurity Service Tool">
        <!-- popup.js swaps src only when theme path changes (avoids alt-text flash). -->
        <img
          class="brand-logo"
          data-brand-wordmark="1"
          data-src-dark="../icons/buusdo-wordmark.svg"
          data-src-light="../icons/buusdo-wordmark-on-light.svg"
          src="../icons/buusdo-wordmark.svg"
          width="117"
          height="40"
          decoding="sync"
          alt=""
          aria-hidden="true"
        />
      </h1>
    </header>

    <main>
      <p class="readout" id="readout" data-level="idle" role="status" data-testid="extension-status">
        <span class="mark" aria-hidden="true"></span>
        <span id="statusWord">Standby</span>
      </p>
      <p id="statusDetail" class="detail">Watching this tab — alerts appear on the page.</p>

      <dl class="counts" aria-label="This tab">
        <div>
          <dt id="trackersLabel">Trackers</dt>
          <dd id="trackersValue">0</dd>
        </div>
        <div>
          <dt id="phishingLabel">Signals</dt>
          <dd id="phishingValue">0</dd>
        </div>
      </dl>

      <p class="manage">
        <a
          id="manageListsLink"
          class="text-button"
          href="https://buusdocst.mtsu.workers.dev/en/settings#settings-block-lists"
          target="_blank"
          rel="noreferrer"
          data-testid="extension-manage-lists"
        >Manage block &amp; trust lists</a>
      </p>
      <p id="manageListsHint" class="hint">Lists open on the website — not in this popup.</p>

      <div
        id="apiUnreachable"
        class="api-unreachable"
        hidden
        data-testid="extension-api-unreachable"
        role="status"
      >
        <p id="apiUnreachableText" class="api-unreachable-text"></p>
        <a
          id="chinaNoticeCta"
          class="primary-button china-notice-cta"
          href="https://otas0.github.io/buusdocst/?utm_source=extension"
          target="_blank"
          rel="noreferrer"
          data-testid="extension-china-notice-cta"
        >Open China notice</a>
      </div>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
