<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>buusdo Cybersecurity Service Tool</title>
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <h1 id="appTitle" class="brand-lockup">
        <img
          class="brand-logo brand-logo-on-dark"
          src="../icons/buusdo-wordmark.png"
          width="117"
          height="40"
          decoding="async"
          alt="buusdo Cybersecurity Service Tool"
        />
        <img
          class="brand-logo brand-logo-on-light"
          src="../icons/buusdo-wordmark-on-light.png"
          width="117"
          height="40"
          decoding="async"
          alt=""
          aria-hidden="true"
        />
        <span class="visually-hidden">buusdo Cybersecurity Service Tool</span>
      </h1>
    </header>

    <main>
      <p class="readout" id="readout" data-level="idle" role="status" data-testid="extension-status">
        <span class="mark" aria-hidden="true"></span>
        <span id="statusWord">Standby</span>
      </p>
      <p id="statusDetail" class="detail">Watching this tab — alerts appear on the page.</p>

      <dl class="counts" aria-label="This tab">
        <div>
          <dt id="trackersLabel">Trackers</dt>
          <dd id="trackersValue">0</dd>
        </div>
        <div>
          <dt id="phishingLabel">Signals</dt>
          <dd id="phishingValue">0</dd>
        </div>
      </dl>

      <p class="manage">
        <a
          id="manageListsLink"
          class="text-button"
          href="https://buusdocst.mtsu.workers.dev/en/settings#settings-block-lists"
          target="_blank"
          rel="noreferrer"
          data-testid="extension-manage-lists"
        >Manage block &amp; trust lists</a>
      </p>
      <p id="manageListsHint" class="hint">Lists open on the website — not in this popup.</p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
