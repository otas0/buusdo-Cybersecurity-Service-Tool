<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>扩展安装 · buusdo Cybersecurity Service Tool</title>
    <link rel="icon" href="./assets/buusdo-logo.png" type="image/png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="top">
        <h1 class="brand-lockup">
          <img class="brand-logo" src="./assets/buusdo-logo.png" width="176" height="60" alt="buusdo Cybersecurity Service Tool" />
        </h1>
        <p class="lang-switch"><a href="./index.html">← 返回</a></p>
      </header>

      <section class="stage">
        <h2>Chrome</h2>
        <p>
          正式方式：<strong>Chrome 网上应用店</strong>搜索 buusdo →
          Add to Chrome。商店链接上架后会写在产品配置里；未上架前请使用开发者提供的安装包说明。
        </p>
        <p>
          扩展默认连接
          <code>https://pcpd.mtsu.workers.dev</code>
          。若本机访问 Workers 超时，会显示专用提示，不代表扩展损坏。
        </p>
      </section>

      <section class="stage">
        <h2>Safari（macOS）</h2>
        <p>
          正式方式：<strong>Mac App Store</strong>安装 buusdo
          包装应用 → Safari → 设置 → 扩展 → 启用。
        </p>
      </section>

      <section class="stage">
        <h2>完整检查站</h2>
        <p>
          网络允许时打开
          <a href="https://pcpd.mtsu.workers.dev/en" rel="noreferrer"
            >https://pcpd.mtsu.workers.dev/en</a
          >
          。
        </p>
      </section>
    </main>
  </body>
</html>
